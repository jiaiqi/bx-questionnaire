<body>
  <div class="proto">
    <header class="proto__top">
      <a class="proto__brand" href="#/answer/cover" aria-label="园区问卷 · 回到封面">
        <span class="proto__mark serif" aria-hidden="true">问</span>

          <span class="proto__sub">清简 · V6 交互原型</span>

      <div class="proto__tabs" id="tabs"></div>

      <div class="proto__actions">
        <button type="button" class="proto__action" id="catalog-btn" aria-haspopup="dialog">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8.5 6.5h11M8.5 12h11M8.5 17.5h11" />

          </svg>
          <span>重置数据</span>
        </button>
      </div>
    </header>

    <main class="proto__stage" id="stage">
      <div class="proto__frame" id="frame"></div>
      <div class="proto__caption" aria-live="polite">
        <span class="proto__caption-label">封面</span>
        <span class="proto__caption-note"></span>
      </div>
    </main>
  </div>

  <div class="proto__toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div class="catalog" id="catalog"></div>
  <div class="modal" id="modal"></div>

  <script src="assets/shell.js"></script>
