/* ═══════════════════════════════════════════════════════════════════════════
   V6「清简」设计令牌 · 唯一真源
   现代、干净、克制：冷白画布 + 白纸面 + 墨黑文字 + 唯一一笔靛蓝。
   —— 除本文件外，任何 CSS 都不得出现裸色值 / 裸字号 / 裸间距。
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  /* ── 画布与墨（冷调中性，不用纸张暖色） ─────────────────────────────── */
  --c-paper: #f5f6f8;          /* 画布底 */
  --c-sheet: #ffffff;          /* 卡片 / 输入框面 */
  --c-sheet-2: #fafbfc;        /* 次级面：只读区 / 表头 */
  --c-sheet-3: #f1f3f6;        /* 选中浅底 / 悬停 */

  --c-ink: #14161a;            /* 主文字 18.5:1 on white */
  --c-ink-2: #4b5563;          /* 次要文字 7.5:1 */
  --c-ink-3: #667080;          /* 元信息 5.0:1（≥12px 可用） */
  --c-ink-4: #9ca3af;          /* 仅占位 / 装饰，不承载信息 */

  --c-line: #e5e7eb;           /* 描边、分割线 */
  --c-line-2: #f0f1f4;         /* 细分隔 */
  --c-line-3: #d3d7de;         /* 强描边 / 悬停 */

  /* ── 唯一一笔：靛蓝 ──────────────────────────────────────────────────── */
  --c-accent: #3b4edb;         /* 主行动 / 进度 / 选中 · 白字 6.3:1 */
  --c-accent-hover: #2f41c2;
  --c-accent-press: #26359e;
  --c-accent-soft: #eef1fd;
  --c-accent-line: #c9d1f7;
  --c-accent-ink: #2939c4;     /* 浅底上的强调文字 */
  --c-on-accent: #ffffff;      /* 强调色上的文字 */

  /* ── 语义色（低饱和，现代中性） ──────────────────────────────────────── */
  --c-ok: #0f7a5a;
  --c-ok-soft: #ecf7f2;
  --c-ok-line: #b3ddcd;

  --c-warn: #a34a08;
  --c-warn-soft: #fdf5ea;
  --c-warn-line: #efd3ac;

  --c-danger: #c22f24;
  --c-danger-soft: #fef3f2;
  --c-danger-line: #f4c7c3;

  --c-focus: #8b96ee;          /* 浅色备选焦点环（本版主焦点用 accent） */

  /* 遮罩 */
  --c-scrim: rgba(20, 24, 33, 0.34);
  --c-scrim-soft: rgba(20, 24, 33, 0.22);

  /* ── 字体（产品 UI 全部无衬线；V6.1 起不再使用衬线） ─────────────────── */
  --font-sans: 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Source Han Sans SC',
    'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-serif: var(--font-sans); /* 兼容旧类名；实际渲染为无衬线 */
  --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;

  --fw-reg: 400;
  --fw-med: 500;
  --fw-semi: 600;

  /* ── 字阶（六档 + 一档展示） ──────────────────────────────────────────── */
  --fs-display: 32px;
  --lh-display: 1.25;
  --fs-h1: 24px;
  --lh-h1: 1.32;
  --fs-h2: 19px;
  --lh-h2: 1.4;
  --fs-h3: 16px;
  --lh-h3: 1.5;
  --fs-body: 15px;
  --lh-body: 1.7;
  --fs-sub: 13px;
  --lh-sub: 1.6;
  --fs-cap: 12px;
  --lh-cap: 1.5;
  --fs-micro: 11px;
  --lh-micro: 1.45;

  --ls-tight: -0.02em;         /* 大字号收紧 */
  --ls-wide: 0.08em;           /* 小标签放宽 */

  /* ── 间距（4 基数） ───────────────────────────────────────────────────── */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;
  --sp-16: 64px;

  /* ── 圆角 ─────────────────────────────────────────────────────────────── */
  --r-1: 4px;
  --r-2: 8px;
  --r-3: 10px;
  --r-4: 14px;
  --r-5: 20px;
  --r-pill: 999px;

  /* ── 阴影（中性冷调，只表达浮起） ─────────────────────────────────────── */
  --sh-1: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 16px -8px rgba(16, 24, 40, 0.08);
  --sh-2: 0 4px 12px -2px rgba(16, 24, 40, 0.08), 0 12px 32px -12px rgba(16, 24, 40, 0.16);
  --sh-3: 0 8px 24px rgba(16, 24, 40, 0.1), 0 24px 56px -24px rgba(16, 24, 40, 0.22);
  --sh-accent: 0 1px 2px rgba(59, 78, 219, 0.24), 0 6px 16px -8px rgba(59, 78, 219, 0.45);
  --sh-device:
    0 2px 2px rgba(20, 22, 26, 0.18) inset,
    0 0 0 1px rgba(20, 22, 26, 0.8),
    0 32px 70px -28px rgba(20, 22, 26, 0.5);
  --sh-knob: 0 1px 2px rgba(16, 24, 40, 0.18);
  --sh-seg: 0 1px 2px rgba(16, 24, 40, 0.08);

  /* ── 动效 ─────────────────────────────────────────────────────────────── */
  --dur-fast: 120ms;
  --dur: 180ms;
  --dur-slow: 260ms;
  --dur-hero: 900ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-inout: cubic-bezier(0.4, 0, 0.2, 1);

  /* ── 布局 ─────────────────────────────────────────────────────────────── */
  --w-phone: 390px;
  --h-phone: 780px;
  --w-desktop: 1320px;
  --h-desktop: 880px;
  --w-read: 640px;

  /* ── 层级 ─────────────────────────────────────────────────────────────── */
  --z-sticky: 10;
  --z-overlay: 60;
  --z-toast: 80;
}

/* 管理端密度：只覆盖排版变量，不换颜色（两端一脉） */
.dense {
  --fs-body: 13px;
  --lh-body: 1.5;
  --fs-sub: 12px;
  --lh-sub: 1.5;
  --fs-cap: 12px;
  --fs-micro: 11px;
}

</style>
  <style data-src="assets/base.css">
/* ═══════════════════════════════════════════════════════════════════════════
   V6「清简」基础层
   1) 重置与排版      2) 共享组件（契约 §4）
   3) 原型外壳（顶栏 / 设备框 / 目录 / 弹层 / toast）
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 1. 重置与排版 ──────────────────────────────────────────────────────── */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--c-paper);
  color: var(--c-ink);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p, figure {
  margin: 0;
}

img, svg {
  display: block;
  max-width: 100%;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
}

input, textarea, select {
  font: inherit;
  color: inherit;
}

::selection {
  background: var(--c-accent-soft);
  color: var(--c-accent-ink);
}

:where(button, a, input, textarea, select, [tabindex]):focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

/* 文字工具 */
.tnum { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--font-serif); }
.muted { color: var(--c-ink-2); }
.cap { font-size: var(--fs-cap); line-height: var(--lh-cap); color: var(--c-ink-3); }
.micro {
  font-size: var(--fs-micro);
  line-height: var(--lh-micro);
  letter-spacing: 0.08em;
  color: var(--c-ink-3);
}
.h1 { font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: var(--fw-semi); letter-spacing: var(--ls-tight); }
.h2 { font-size: var(--fs-h2); line-height: var(--lh-h2); font-weight: var(--fw-semi); letter-spacing: var(--ls-tight); }
.h3 { font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: var(--fw-semi); }
.display {
  font-family: var(--font-sans);
  font-size: var(--fs-display);
  line-height: var(--lh-display);
  font-weight: var(--fw-semi);
  letter-spacing: var(--ls-tight);
}
.body { font-size: var(--fs-body); line-height: var(--lh-body); }
.sub { font-size: var(--fs-sub); line-height: var(--lh-sub); color: var(--c-ink-2); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.divider {
  height: 1px;
  background: var(--c-line-2);
  border: 0;
  margin: 0;
}
.rule {
  height: 1px;
  background: var(--c-line);
  border: 0;
  margin: 0;
}

/* ── 2. 共享组件 ────────────────────────────────────────────────────────── */

/* 按钮 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  height: 44px;
  padding: 0 var(--sp-5);
  border: 1px solid transparent;
  border-radius: var(--r-3);
  background: transparent;
  color: var(--c-ink);
  font-size: var(--fs-body);
  font-weight: var(--fw-med);
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition:
    background var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),
    color var(--dur-fast) var(--ease-out),
    box-shadow var(--dur) var(--ease-out),
    transform var(--dur-fast) var(--ease-out);
}
.btn:active { transform: translateY(1px); }
.btn[disabled],
.btn[aria-disabled='true'] {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}
.btn__icon { flex: none; }
.btn--primary {
  background: var(--c-accent);
  border-color: var(--c-accent);
  color: var(--c-on-accent);
  box-shadow: var(--sh-accent);
}
.btn--primary:hover { background: var(--c-accent-hover); border-color: var(--c-accent-hover); }
.btn--primary:active { background: var(--c-accent-press); }
.btn--ghost {
  background: var(--c-sheet);
  border-color: var(--c-line-3);
  color: var(--c-ink);
}
.btn--ghost:hover { border-color: var(--c-ink-4); background: var(--c-sheet); }
.btn--quiet { color: var(--c-ink-2); }
.btn--quiet:hover { background: var(--c-sheet-3); color: var(--c-ink); }
.btn--danger {
  background: var(--c-danger);
  border-color: var(--c-danger);
  color: var(--c-on-accent);
}
.btn--sm { height: 34px; padding: 0 var(--sp-3); font-size: var(--fs-sub); border-radius: var(--r-2); }
.btn--lg { height: 50px; padding: 0 var(--sp-6); font-size: var(--fs-h3); border-radius: var(--r-3); }
.btn--block { width: 100%; }
.btn--icon {
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: var(--r-2);
  color: var(--c-ink-2);
}
.btn--icon:hover { background: var(--c-sheet-3); color: var(--c-ink); }
.dense .btn { height: 40px; padding: 0 var(--sp-4); font-size: var(--fs-sub); }
.dense .btn--sm { height: 30px; padding: 0 var(--sp-2); font-size: var(--fs-cap); }
.dense .btn--icon { width: 34px; height: 34px; }

/* 输入控件 */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  min-width: 0;
}
.field__label {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  font-size: var(--fs-sub);
  font-weight: var(--fw-med);
  color: var(--c-ink-2);
}
.field__req { color: var(--c-danger); font-weight: var(--fw-semi); }
.field__hint { font-size: var(--fs-cap); line-height: var(--lh-cap); color: var(--c-ink-3); }
.field__error {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  font-size: var(--fs-cap);
  line-height: var(--lh-cap);
  color: var(--c-danger);
}
.field.is-invalid .input,
.field.is-invalid .textarea,
.field.is-invalid .select { border-color: var(--c-danger); }

.input,
.textarea,
.select {
  width: 100%;
  height: 44px;
  padding: 0 var(--sp-3);
  border: 1px solid var(--c-line);
  border-radius: var(--r-3);
  background: var(--c-sheet);
  color: var(--c-ink);
  font-size: var(--fs-body);
  line-height: 1.4;
  transition:
    border-color var(--dur-fast) var(--ease-out),
    box-shadow var(--dur) var(--ease-out),
    background var(--dur-fast) var(--ease-out);
}
.input::placeholder,
.textarea::placeholder { color: var(--c-ink-4); }
.input:hover,
.textarea:hover,
.select:hover { border-color: var(--c-line-3); }
.input:focus,
.textarea:focus,
.select:focus {
  outline: none;
  border-color: var(--c-accent);
  box-shadow: 0 0 0 3px var(--c-accent-soft);
}
.textarea {
  height: auto;
  min-height: 104px;
  padding: var(--sp-3);
  line-height: var(--lh-body);
  resize: vertical;
}
.select {
  appearance: none;
  padding-right: var(--sp-8);
  cursor: pointer;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--c-ink-3) 50%),
    linear-gradient(135deg, var(--c-ink-3) 50%, transparent 50%);
  background-position:
    calc(100% - 18px) calc(50% + 1px),
    calc(100% - 13px) calc(50% + 1px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.dense .input,
.dense .textarea,
.dense .select { height: 40px; font-size: var(--fs-sub); }

/* 卡片 */
.card {
  background: var(--c-sheet);
  border: 1px solid var(--c-line);
  border-radius: var(--r-4);
  box-shadow: var(--sh-1);
}
.card--flat { box-shadow: none; }
.card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--c-line-2);
}
.card__title { font-size: var(--fs-h3); font-weight: var(--fw-semi); }
.card__sub { font-size: var(--fs-cap); color: var(--c-ink-3); }

/* 胶囊 / 标签 / 状态 */
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  height: 26px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  border: 1px solid var(--c-line);
  background: var(--c-sheet-2);
  color: var(--c-ink-2);
  font-size: var(--fs-cap);
  line-height: 1;
  white-space: nowrap;
}
.chip--accent { background: var(--c-accent-soft); border-color: var(--c-accent-line); color: var(--c-accent-ink); }
.chip--ok { background: var(--c-ok-soft); border-color: var(--c-ok-line); color: var(--c-ok); }
.chip--warn { background: var(--c-warn-soft); border-color: var(--c-warn-line); color: var(--c-warn); }
.chip--muted { background: transparent; border-color: var(--c-line); color: var(--c-ink-3); }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-sub);
  line-height: 1;
  color: var(--c-ink-2);
  white-space: nowrap;
}
.tag__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.tag--ok { color: var(--c-ok); }
.tag--warn { color: var(--c-warn); }
.tag--accent { color: var(--c-accent); }
.tag--muted { color: var(--c-ink-3); }

/* 开关 */
.switch {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  cursor: pointer;
  user-select: none;
}
.switch input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}
.switch__track {
  position: relative;
  width: 36px;
  height: 21px;
  border-radius: var(--r-pill);
  background: var(--c-line-3);
  transition: background var(--dur) var(--ease-out);
  flex: none;
}
.switch__track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: var(--c-sheet);
  box-shadow: var(--sh-knob);
  transition: transform var(--dur) var(--ease-out);
}
.switch input:checked + .switch__track { background: var(--c-accent); }
.switch input:checked + .switch__track::after { transform: translateX(15px); }
.switch input:focus-visible + .switch__track { outline: 2px solid var(--c-accent); outline-offset: 2px; }
.switch__text { font-size: var(--fs-sub); color: var(--c-ink-2); }

/* 分段控件 */
.seg {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--c-line);
  border-radius: var(--r-pill);
  background: var(--c-sheet-2);
}
.seg__item {
  height: 28px;
  padding: 0 var(--sp-3);
  border-radius: var(--r-pill);
  color: var(--c-ink-3);
  font-size: var(--fs-sub);
  line-height: 1;
  white-space: nowrap;
  transition: color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur);
}
.seg__item:hover { color: var(--c-ink); }
.seg__item.is-active {
  background: var(--c-sheet);
  color: var(--c-ink);
  font-weight: var(--fw-med);
  box-shadow: var(--sh-seg);
}
.dense .seg__item { height: 26px; font-size: var(--fs-cap); padding: 0 var(--sp-2); }

/* 进度 */
.progress {
  height: 2px;
  border-radius: var(--r-pill);
  background: var(--c-line-2);
  overflow: hidden;
}
.progress__fill {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--c-accent);
  transition: width var(--dur-slow) var(--ease-out);
}

/* 空态 */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-3);
  padding: var(--sp-12) var(--sp-6);
  text-align: center;
}
.empty__art { color: var(--c-line-3); }
.empty__title { font-size: var(--fs-h3); font-weight: var(--fw-semi); color: var(--c-ink); }
.empty__tip { max-width: 38ch; font-size: var(--fs-sub); line-height: var(--lh-sub); color: var(--c-ink-3); }

/* 骨架 */
.skeleton {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-2);
  background: var(--c-sheet-3);
}
.skeleton::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, var(--c-sheet-2), transparent);
  transform: translateX(-100%);
  animation: skeleton-sweep 1.4s var(--ease-inout) infinite;
}
@keyframes skeleton-sweep {
  to { transform: translateX(100%); }
}

/* 移动端顶栏 */
.appbar {
  position: sticky;
  top: 0;
  z-index: var(--z-sticky);
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  height: 48px;

/* 已完成状态 */
.ans-cover__done {
  margin-top: var(--sp-6);
  padding: var(--sp-5);
  border: 1px solid var(--c-line);
  border-radius: var(--r-4);
  background: var(--c-sheet);
  box-shadow: var(--sh-1);
}
.ans-cover__done-head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.ans-cover__done-title {
  color: var(--c-ink);
  font-size: var(--fs-body);
  font-weight: var(--fw-semi);
}
.ans-cover__done-meta {
  margin-top: var(--sp-1);
  color: var(--c-ink-3);
  font-size: var(--fs-cap);
  font-variant-numeric: tabular-nums;
}
.ans-cover__done-actions {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin-top: var(--sp-4);
}
.ans-cover__restart {
  align-self: center;
  margin-top: var(--sp-1);
  color: var(--c-ink-3);
  font-size: var(--fs-cap);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: var(--c-line-3);
}
.ans-cover__restart:hover { color: var(--c-ink); text-decoration-color: var(--c-ink-3); }

/* ── 3. 作答页 ──────────────────────────────────────────────────────────── */

.ans-prog {
  position: sticky;
  top: 48px;
  z-index: 9;
  background: var(--c-paper);
}
.ans-prog__row {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-5) var(--sp-2);
}
.ans-prog__count {
  color: var(--c-ink-2);
  font-size: var(--fs-cap);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ans-prog__count b {
  color: var(--c-ink);
  font-size: var(--fs-sub);
  font-weight: var(--fw-semi);
}
.ans-prog__req {
  margin-left: auto;
  color: var(--c-ink-3);
  font-size: var(--fs-cap);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ans-prog__req.is-done { color: var(--c-ok); }
.ans-prog__save {
  min-width: 76px;
  overflow: hidden;
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  opacity: 0;
  transition: opacity var(--dur) var(--ease-out);
}
.ans-prog__save.is-on { opacity: 1; }
.ans-prog .progress { border-radius: 0; }

/* 校验摘要 */
.ans-alert {
  margin: var(--sp-4) 0 0;
  padding: var(--sp-3) var(--sp-4) var(--sp-2);
  border: 1px solid var(--c-danger-line);
  border-radius: var(--r-3);
  background: var(--c-danger-soft);
}
.ans-alert__head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  color: var(--c-danger);
  font-size: var(--fs-sub);
  font-weight: var(--fw-med);
  line-height: var(--lh-sub);
}
.ans-alert__head svg { flex: none; }
.ans-alert__list {
  margin: var(--sp-1) 0 0;
  padding: 0;
  list-style: none;
}
.ans-alert__jump {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  min-height: 40px;
  padding: 0;
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  text-align: left;
  border-top: 1px solid var(--c-danger-line);
  transition: color var(--dur-fast);
}
.ans-alert__list li:first-child .ans-alert__jump { border-top: 0; }
.ans-alert__jump:hover { color: var(--c-danger); }
.ans-alert__jump .tnum {
  color: var(--c-danger);
  font-size: var(--fs-micro);
  letter-spacing: var(--ls-wide);
}
.ans-alert__jump svg { margin-left: auto; color: var(--c-danger); opacity: 0.7; }

/* 题目 */
.ans-qs {
  padding-top: var(--sp-2);
}
.ans-q {
  position: relative;
  padding: var(--sp-6) 0 var(--sp-6);
  border-bottom: 1px solid var(--c-line-2);
  scroll-margin-top: 108px;
}
.ans-q:last-child { border-bottom: 0; }
.ans-q__meta {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: 16px;
}
.ans-q__no {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: var(--lh-micro);
  letter-spacing: var(--ls-wide);
  font-variant-numeric: tabular-nums;
}
.ans-q__sep {
  width: 1px;
  height: 10px;
  background: var(--c-line-3);
}
.ans-q__flag {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: var(--lh-micro);
  letter-spacing: var(--ls-wide);
  white-space: nowrap;
}
.ans-q.is-invalid .ans-q__no { color: var(--c-danger); }
.ans-q.is-invalid .ans-q__flag { color: var(--c-danger); }
.ans-q.is-invalid::before {
  content: '';
  position: absolute;
  left: calc(-1 * var(--sp-5));
  top: var(--sp-6);
  bottom: var(--sp-6);
  width: 2px;
  border-radius: var(--r-pill);
  background: var(--c-danger);
}
.ans-q__title {
  margin-top: var(--sp-2);
  color: var(--c-ink);
  font-size: var(--fs-h3);
  line-height: 1.6;
  font-weight: var(--fw-med);
}
.ans-q__body {
  margin-top: var(--sp-4);
}
.ans-q__err {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  margin-top: var(--sp-2);
  color: var(--c-danger);
  font-size: var(--fs-cap);
  line-height: var(--lh-cap);
}
.ans-q__err svg { flex: none; }

/* 整行选项 */
.ans-opts {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.ans-opt {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 48px;
  padding: var(--sp-2) var(--sp-4);
  border: 1px solid var(--c-line);
  border-radius: var(--r-3);
  background: var(--c-sheet);
  cursor: pointer;
  transition:
    background var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),
    box-shadow var(--dur) var(--ease-out);
}
.ans-opt:hover { border-color: var(--c-line-3); background: var(--c-sheet-2); }
.ans-opt:has(.ans-opt__input:checked) {
  border-color: var(--c-accent-line);
  background: var(--c-accent-soft);
}
.ans-opt:has(.ans-opt__input:checked):hover { border-color: var(--c-accent); }
.ans-opt:has(.ans-opt__input:focus-visible) {
  outline: 2px solid var(--c-accent);
  outline-offset: 2px;
}
.ans-opt.is-disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.ans-opt__input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}
.ans-opt__mark {
  flex: none;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border: 1px solid var(--c-line-3);
  border-radius: 50%;
  background: var(--c-sheet);
  transition:
    border-color var(--dur-fast) var(--ease-out),
    background var(--dur-fast) var(--ease-out);
}
.ans-opt__mark::after {
  content: '';
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--c-accent);
  transform: scale(0);
  transition: transform var(--dur) var(--ease-out);
}
.ans-opt--check .ans-opt__mark { border-radius: var(--r-1); }
.ans-opt--check .ans-opt__mark::after { display: none; }
.ans-opt--check .ans-opt__mark svg {
  color: var(--c-on-accent);
  opacity: 0;
  transform: scale(0.7);
  transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur) var(--ease-out);
}
.ans-opt__input:checked ~ .ans-opt__mark {
  border-color: var(--c-accent);
  background: var(--c-accent);
}
.ans-opt__input:checked ~ .ans-opt__mark::after { transform: scale(1); }
.ans-opt--check .ans-opt__input:checked ~ .ans-opt__mark svg {
  opacity: 1;
  transform: scale(1);
}
.ans-opt__label {
  color: var(--c-ink);
  font-size: var(--fs-body);
  line-height: 1.5;
}
.ans-opt__input:checked ~ .ans-opt__label {
  color: var(--c-accent-ink);
  font-weight: var(--fw-med);
}
.ans-q.is-invalid .ans-opt { border-color: var(--c-danger-line); }
.ans-q.is-invalid .ans-opt:has(.ans-opt__input:checked) {
  border-color: var(--c-danger-line);
  background: var(--c-sheet-2);
}

/* 输入类 */
.ans-input-wrap { position: relative; }
.ans-input-wrap .input { height: 48px; }
.ans-num__unit {
  position: absolute;
  top: 50%;
  right: var(--sp-4);
  transform: translateY(-50%);
  color: var(--c-ink-3);
  font-size: var(--fs-sub);
  pointer-events: none;
}
.ans-num__input { padding-right: var(--sp-10); }

.ans-date { position: relative; }
.ans-date .input {
  height: 48px;
  padding-right: var(--sp-10);
  cursor: pointer;
}
.ans-date__icon {
  position: absolute;
  top: 50%;
  right: var(--sp-4);
  transform: translateY(-50%);
  color: var(--c-ink-3);
  pointer-events: none;
}
.ans-date__input::-webkit-calendar-picker-indicator {
  opacity: 0;
  cursor: pointer;
}
.ans-date__input::-webkit-date-and-time-value { text-align: left; }

/* 选择器式：地址 / 引用 */
.ans-pick-wrap { position: relative; }
.ans-pick {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  min-height: 48px;
  padding: 0 84px 0 var(--sp-4);
  border: 1px solid var(--c-line);
  border-radius: var(--r-3);
  background: var(--c-sheet);
  text-align: left;
  transition: border-color var(--dur-fast), background var(--dur-fast);
}
.ans-pick:hover { border-color: var(--c-line-3); background: var(--c-sheet-2); }
.ans-pick__icon { flex: none; color: var(--c-ink-3); }
.ans-pick__text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  color: var(--c-ink);
  font-size: var(--fs-body);
  white-space: nowrap;
  text-overflow: ellipsis;
}
.ans-pick__text.is-empty { color: var(--c-ink-4); }
.ans-pick__chev {
  position: absolute;
  top: 50%;
  right: var(--sp-3);
  transform: translateY(-50%);
  color: var(--c-ink-3);
}
.ans-pick__clear {
  position: absolute;
  top: 50%;
  right: 28px;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  transform: translateY(-50%);
  border-radius: 50%;
  color: var(--c-ink-3);
}
.ans-pick__clear:hover { background: var(--c-sheet-3); color: var(--c-ink); }
.ans-q.is-invalid .ans-pick { border-color: var(--c-danger-line); }

/* 图片题 */
.ans-img {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
}
.ans-img__add {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-1);
  width: 108px;
  height: 108px;
  border: 1px dashed var(--c-line-3);
  border-radius: var(--r-3);
  background: var(--c-sheet);
  color: var(--c-ink-3);
  transition: border-color var(--dur-fast), background var(--dur-fast), color var(--dur-fast);
}
.ans-img__add:hover {
  border-color: var(--c-accent-line);
  background: var(--c-sheet-2);
  color: var(--c-accent-ink);
}
.ans-img__cap { font-size: var(--fs-micro); letter-spacing: var(--ls-wide); }
.ans-img__thumb {
  position: relative;
  width: 108px;
  height: 108px;
  overflow: hidden;
  border: 1px solid var(--c-line);
  border-radius: var(--r-3);
  background: linear-gradient(145deg, var(--c-sheet-3) 0%, var(--c-sheet-2) 52%, var(--c-line-2) 100%);
}
.ans-img__thumb-icon {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--c-ink-3);
}
.ans-img__remove {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  margin: calc(-1 * var(--sp-2)) 0 0;
  padding: 0;
  color: var(--c-ink-3);
  font-size: var(--fs-cap);
  transition: color var(--dur-fast);
}
.ans-img__remove:hover { color: var(--c-danger); }
.ans-img__meta {
  flex: 1;
  min-width: 0;
  padding-top: var(--sp-1);
}
.ans-img__meta-name {
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ans-img__meta-tip {
  margin-top: var(--sp-1);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: 1.6;
}
.ans-img.is-uploading .ans-img__add { color: var(--c-ink-4); }

/* 多行文本 */
.ans-textarea { min-height: 116px; }
.ans-count {
  margin-top: var(--sp-2);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.ans-count.is-near-limit { color: var(--c-warn); }

/* 吸底提交栏 */
.ans-submitbar { padding-left: var(--sp-4); padding-right: var(--sp-4); }
.ans-submitbar .btn { padding: 0 var(--sp-4); }
.ans-submitbar__draft { color: var(--c-ink-2); }
.ans-submitbar__draft:hover { background: var(--c-sheet-3); color: var(--c-ink); }
.ans-submitbar .sticky-bar__hint {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── 4. 底部弹层（省市区 / 引用）──────────────────────────────────────── */

.ans-sheet-layer {
  position: absolute;
  inset: 44px 0 0 0;
  z-index: var(--z-overlay);
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}
.ans-sheet-layer--fixed {
  position: fixed;
  inset: 0;
}
.ans-sheet__scrim {
  position: absolute;
  inset: 0;
  background: var(--c-scrim);
  animation: ans-fade var(--dur) var(--ease-out);
}
.ans-sheet {
  position: relative;
  width: 100%;
  max-height: 78%;
  display: flex;
  flex-direction: column;
  border-radius: var(--r-4) var(--r-4) 0 0;
  background: var(--c-sheet);
  box-shadow: var(--sh-3);
  animation: ans-sheet-in var(--dur-slow) var(--ease-out);
}
.ans-sheet__grab {
  flex: none;
  width: 36px;
  height: 4px;
  margin: var(--sp-2) auto 0;
  border-radius: var(--r-pill);
  background: var(--c-line-3);
}
.ans-sheet__head {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-3) var(--sp-2) var(--sp-5);
}
.ans-sheet__title {
  flex: 1;
  min-width: 0;
  color: var(--c-ink);
  font-size: var(--fs-h3);
  line-height: var(--lh-h3);
  font-weight: var(--fw-semi);
}
.ans-sheet__close {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-2);
  color: var(--c-ink-2);
}
.ans-sheet__close:hover { background: var(--c-sheet-3); color: var(--c-ink); }
.ans-sheet__crumbs {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  padding: 0 var(--sp-5) var(--sp-2);
  overflow-x: auto;
  scrollbar-width: none;
}
.ans-sheet__crumbs::-webkit-scrollbar { display: none; }
.ans-crumb {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 0 var(--sp-2);
  border-radius: var(--r-2);
  color: var(--c-ink-3);
  font-size: var(--fs-sub);
  white-space: nowrap;
}
.ans-crumb:hover { background: var(--c-sheet-3); color: var(--c-ink); }
.ans-crumb.is-current { color: var(--c-accent-ink); font-weight: var(--fw-med); }
.ans-crumb-sep { color: var(--c-line-3); font-size: var(--fs-sub); }

.ans-sheet__body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--sp-1) var(--sp-4) var(--sp-4);
}
.ans-sheet__list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  margin: 0;
  padding: 0;
  list-style: none;
}
.ans-sheet__opt {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-height: 48px;
  padding: 0 var(--sp-3);
  border-radius: var(--r-2);
  color: var(--c-ink);
  font-size: var(--fs-body);
  text-align: left;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.ans-sheet__opt:hover { background: var(--c-sheet-2); }
.ans-sheet__opt.is-on { background: var(--c-accent-soft); color: var(--c-accent-ink); }
.ans-sheet__opt-mark {
  flex: none;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border: 1px solid var(--c-line-3);
  border-radius: 50%;
  background: var(--c-sheet);
}
.ans-sheet__opt-mark::after {
  content: '';
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--c-accent);
  transform: scale(0);
  transition: transform var(--dur) var(--ease-out);
}
.ans-sheet__opt.is-on .ans-sheet__opt-mark { border-color: var(--c-accent); }
.ans-sheet__opt.is-on .ans-sheet__opt-mark::after { transform: scale(1); }
.ans-sheet__opt-check {
  margin-left: auto;
  color: var(--c-accent);
  opacity: 0;
}
.ans-sheet__opt.is-on .ans-sheet__opt-check { opacity: 1; }
.ans-sheet__foot {
  flex: none;
  display: flex;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));
  border-top: 1px solid var(--c-line-2);
}
.ans-sheet__foot .btn { flex: 1; }
.ans-sheet__empty {
  padding: var(--sp-8) var(--sp-4);
  color: var(--c-ink-3);
  font-size: var(--fs-sub);
  text-align: center;
}

@keyframes ans-sheet-in {
  from { transform: translateY(16px); opacity: 0; }
  to { transform: none; opacity: 1; }
}
@keyframes ans-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ── 5. 提交信息 ────────────────────────────────────────────────────────── */

.ans-submit {
  padding-top: var(--sp-6);
}
.ans-lede__kicker {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: var(--lh-micro);
  letter-spacing: var(--ls-wide);
}
.ans-lede__title {
  margin-top: var(--sp-2);
  color: var(--c-ink);
  font-size: var(--fs-h2);
  line-height: var(--lh-h2);
  font-weight: var(--fw-semi);
}
.ans-lede__body {
  margin-top: var(--sp-2);
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  line-height: 1.75;
}
.ans-form {
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
  margin-top: var(--sp-6);
}
.ans-form .field__label { color: var(--c-ink-2); }
.ans-form .field__hint { color: var(--c-ink-3); }
.ans-form .input,
.ans-form .select { height: 48px; }
.ans-select {
  position: relative;
}
.ans-select .select { padding-right: var(--sp-10); }
.ans-select__icon {
  position: absolute;
  top: 50%;
  right: var(--sp-3);
  transform: translateY(-50%);
  color: var(--c-ink-3);
  pointer-events: none;
}
.ans-form__error {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--c-danger-line);
  border-radius: var(--r-3);
  background: var(--c-danger-soft);
  color: var(--c-danger);
  font-size: var(--fs-sub);
  line-height: var(--lh-sub);
}
.ans-form__error svg { flex: none; }
.ans-form .ans-note { margin-top: 0; }
.ans-form__actions {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
}
.ans-form__actions .btn--primary { height: 50px; font-size: var(--fs-h3); }
.ans-form__actions .btn--quiet { height: 44px; }
.ans-form__foot {
  margin-top: var(--sp-2);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);

  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--c-line);
  background: var(--c-sheet-2);
  color: var(--c-ink-2);
  font-size: var(--fs-micro);
  letter-spacing: 0;
}

.adm-user__text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.35;
}

.adm-user__name {
  font-size: var(--fs-cap);
  color: var(--c-ink-2);
  white-space: nowrap;
}

.adm-user__dept {
  font-size: var(--fs-micro);
  color: var(--c-ink-3);
  white-space: nowrap;
}

/* 顶栏里的文字按钮 */
.adm-appbar__link {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  height: 30px;
  padding: 0 var(--sp-2);
  border-radius: var(--r-1);
  color: var(--c-ink-2);
  font-size: var(--fs-cap);
  white-space: nowrap;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.adm-appbar__link:hover {
  background: var(--c-sheet-3);
  color: var(--c-ink);
}

/* ── 2. 列表页 ───────────────────────────────────────────────────────────── */

.adm-main {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: var(--sp-5);
  min-width: 0;
  padding: var(--sp-8) var(--adm-pad-x) var(--sp-10);
}

.adm-pagehead {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-6);
}

.adm-pagehead__title {
  font-size: var(--fs-h1);
  line-height: var(--lh-h1);
  font-weight: var(--fw-semi);
  letter-spacing: -0.01em;
}

.adm-pagehead__sub {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-1) var(--sp-2);
  margin-top: var(--sp-1);
  font-size: var(--fs-sub);
  color: var(--c-ink-3);
}

.adm-pagehead__sub b {
  color: var(--c-ink-2);
  font-weight: var(--fw-med);
  font-variant-numeric: tabular-nums;
}

.adm-dotsep {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--c-line-3);
  flex: none;
}

.adm-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-3);
}

.adm-search {
  position: relative;
  display: flex;
  align-items: center;
  width: 300px;
  max-width: 100%;
}

.adm-search__icon {
  position: absolute;
  left: 11px;
  display: flex;
  color: var(--c-ink-3);
  pointer-events: none;
}

.adm-search .input {
  height: 40px;
  padding-right: 38px;
  padding-left: 36px;
}

.adm-search .input::-webkit-search-cancel-button,
.adm-search .input::-webkit-search-decoration {
  display: none;
}

.adm-search__clear {
  position: absolute;
  right: 5px;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: var(--r-1);
  color: var(--c-ink-3);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.adm-search__clear:hover {
  background: var(--c-sheet-3);
  color: var(--c-ink);
}

.adm-statusseg .seg__item {
  min-width: 58px;
  text-align: center;
}

/* 卡片与表格 */

.adm-card {
  background: var(--c-sheet);
  border: 1px solid var(--c-line);
  border-radius: var(--r-4);
  box-shadow: var(--sh-1);
}

.adm-tablewrap {
  position: relative;
}

.adm-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
}

.adm-table thead th {
  height: 40px;
  padding: 0 var(--sp-4);
  border-bottom: 1px solid var(--c-line);
  background: var(--c-sheet-2);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  font-weight: var(--fw-med);
  line-height: var(--lh-micro);
  letter-spacing: 0.08em;
  text-align: left;
  white-space: nowrap;
}

.adm-table thead th:first-child {
  padding-left: var(--sp-5);
  border-top-left-radius: var(--r-4);
}

.adm-table thead th:last-child {
  padding-right: var(--sp-5);
  border-top-right-radius: var(--r-4);
  text-align: right;
}

.adm-table .adm-th--num {
  text-align: right;
}

.adm-table .adm-col--status { width: 104px; }
.adm-table .adm-col--items { width: 64px; }
.adm-table .adm-col--replies { width: 88px; }
.adm-table .adm-col--deadline { width: 108px; }
.adm-table .adm-col--updated { width: 96px; }
.adm-table .adm-col--acts { width: 148px; }

.adm-table tbody td {
  height: var(--adm-row-h);
  padding: 0 var(--sp-4);
  border-bottom: 1px solid var(--c-line-2);
  vertical-align: middle;
}

.adm-table tbody td:first-child {
  padding-left: var(--sp-5);
}

.adm-table tbody td:last-child {
  padding-right: var(--sp-5);
}

.adm-table tbody tr:last-child td {
  border-bottom: 0;
}

.adm-table tbody tr {
  transition: background var(--dur-fast) var(--ease-out);
}

.adm-table tbody tr:hover {
  background: var(--c-sheet-3);
}

.adm-table tbody tr.is-new {
  animation: adm-row-in 600ms var(--ease-out);
}

@keyframes adm-row-in {
  from { background: var(--c-accent-soft); }
  to { background: transparent; }
}

.adm-cell--num {
  text-align: right;
  color: var(--c-ink-2);
  font-variant-numeric: tabular-nums;
}

.adm-cell--time {
  color: var(--c-ink-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.adm-q {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.adm-q__title {
  overflow: hidden;
  color: var(--c-ink);
  font-size: var(--fs-body);
  font-weight: var(--fw-med);
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.adm-q__desc {
  overflow: hidden;
  color: var(--c-ink-3);
  font-size: var(--fs-cap);
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.adm-rowacts {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 1px;
  opacity: 1;
}

/* 行内文字操作 hover / 聚焦才显形；「更多」常驻，避免操作列看起来是空的 */
.adm-rowacts .adm-act:not(.adm-act--icon) {
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease-out);
}

.adm-table tbody tr:hover .adm-rowacts .adm-act:not(.adm-act--icon),
.adm-table tbody tr:focus-within .adm-rowacts .adm-act:not(.adm-act--icon) {
  opacity: 1;
  pointer-events: auto;
}

.adm-act {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 var(--sp-2);
  border-radius: var(--r-1);
  color: var(--c-ink-2);
  font-size: var(--fs-cap);
  white-space: nowrap;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.adm-act:hover {
  background: var(--c-sheet);
  color: var(--c-ink);
}
.adm-act--icon {
  width: 28px;
  justify-content: center;
  padding: 0;
  color: var(--c-ink-3);
}

.adm-morecell {
  position: relative;
}

.adm-menu {
  position: absolute;
  top: calc(100% - var(--sp-2));
  right: var(--sp-4);
  z-index: 6;
  width: 176px;
  padding: var(--sp-1);
  border: 1px solid var(--c-line);
  border-radius: var(--r-2);
  background: var(--c-sheet);
  box-shadow: var(--sh-2);
  animation: modal-in var(--dur-fast) var(--ease-out);
}

.adm-menu__item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  padding: 8px 10px;
  border-radius: var(--r-1);
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  text-align: left;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.adm-menu__item:hover {
  background: var(--c-sheet-3);
  color: var(--c-ink);
}
.adm-menu__item--danger {
  color: var(--c-danger);
}
.adm-menu__item--danger:hover {
  background: var(--c-danger-soft);
  color: var(--c-danger);
}

/* 分页 */

.adm-tablefoot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  min-height: 56px;
  padding: 0 var(--sp-5);
  border-top: 1px solid var(--c-line);
  color: var(--c-ink-3);
  font-size: var(--fs-cap);
  font-variant-numeric: tabular-nums;
}

.adm-pager {
  display: flex;
  align-items: center;
  gap: 2px;
}

.adm-pagebtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  padding: 0 var(--sp-2);
  border-radius: var(--r-1);
  color: var(--c-ink-2);
  font-size: var(--fs-cap);
  font-variant-numeric: tabular-nums;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.adm-pagebtn:hover:not(:disabled) {
  background: var(--c-sheet-3);
  color: var(--c-ink);
}
.adm-pagebtn.is-active {
  background: var(--c-accent-soft);
  color: var(--c-accent-ink);
  font-weight: var(--fw-semi);
}
.adm-pagebtn:disabled {
  opacity: 0.38;
  cursor: default;
}

/* 空态 */

.adm-empty {
  min-height: 340px;
  padding: var(--sp-12) var(--sp-6);
}

.adm-empty[hidden] {
  display: none;
}

.adm-empty .empty__art {
  color: var(--c-line-3);
}

/* ── 3. 列表加载骨架 ─────────────────────────────────────────────────────── */

.adm-skel {
  display: block;
  border-radius: var(--r-1);
}

.adm-skel--search {
  width: 300px;
  height: 40px;
  border-radius: var(--r-3);
}

.adm-skel--seg {
  width: 268px;
  height: 34px;
  border-radius: var(--r-pill);
}

.adm-skel--sub {
  width: 210px;
  height: 12px;
}

.adm-skel--title {
  width: 44%;
  height: 12px;
}

.adm-skel--desc {
  width: 64%;
  height: 10px;
}

.adm-skel--status {
  width: 56px;
  height: 10px;
}

.adm-skel--num {
  width: 26px;
  height: 10px;
  margin-left: auto;
}

.adm-skel--date {
  width: 76px;
  height: 10px;
}

.adm-skel--time {
  width: 62px;
  height: 10px;
}

.adm-skel--foot {
  width: 180px;
  height: 10px;
}

.adm-skel--page {
  width: 96px;
  height: 20px;
}

.adm-skelrow {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

/* ── 4. 设计器 ───────────────────────────────────────────────────────────── */

.adm-appbar--designer {
  gap: var(--sp-2);
}

.adm-appbar__back {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: var(--r-1);
  color: var(--c-ink-2);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.adm-appbar__back:hover {
  background: var(--c-sheet-3);
  color: var(--c-ink);
}

.adm-nameinput {
  width: min(360px, 38%);
  height: 30px;
  padding: 0 var(--sp-2);
  border: 1px solid transparent;
  border-radius: var(--r-1);
  background: transparent;
  color: var(--c-ink);
  font-size: var(--fs-sub);
  font-weight: var(--fw-med);
  text-overflow: ellipsis;
  transition: border-color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur);
}
.adm-nameinput:hover {
  border-color: var(--c-line);
  background: var(--c-sheet-2);
}
.adm-nameinput:focus {
  outline: none;
  border-color: var(--c-accent);
  background: var(--c-sheet);
  box-shadow: 0 0 0 3px var(--c-accent-soft);
}

.adm-dirty {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  font-size: var(--fs-micro);
  color: var(--c-ink-3);
  white-space: nowrap;
}

.adm-dirty__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c-ok);
  flex: none;
}

.adm-dirty.is-dirty {
  color: var(--c-warn);
}
.adm-dirty.is-dirty .adm-dirty__dot {
  background: var(--c-warn);
}

.adm-designer {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* 左：题目目录 */

.adm-outline {
  display: flex;
  flex: none;
  flex-direction: column;
  width: var(--adm-outline-w);
  min-height: 0;
  border-right: 1px solid var(--c-line);
  background: var(--c-sheet);
}

.adm-outline__head {
  display: flex;
  flex: none;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-4) var(--sp-5) var(--sp-2);
}

.adm-outline__label {
  font-size: var(--fs-micro);
  letter-spacing: 0.1em;
  color: var(--c-ink-3);
}

.adm-outline__count {
  font-size: var(--fs-micro);
  color: var(--c-ink-3);
  font-variant-numeric: tabular-nums;
}

.adm-outline__list {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 2px;
  min-height: 0;
  padding: 0 var(--sp-2) var(--sp-3);
  overflow-y: auto;
  scrollbar-width: thin;
}

.adm-outline__item {
  position: relative;
  display: flex;
  gap: var(--sp-2);
  padding: 10px var(--sp-2) 10px var(--sp-3);
  border-radius: var(--r-2);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out);
}

.adm-outline__item:hover {
  background: var(--c-sheet-2);
}

.adm-outline__item.is-active {
  background: var(--c-accent-soft);
}

.adm-outline__item.is-active::before {
  content: '';
  position: absolute;
  top: 8px;
  bottom: 8px;
  left: 0;
  width: 2px;
  border-radius: 2px;
  background: var(--c-accent);
}

.adm-outline__item.is-dragging {
  opacity: 0.45;
}

.adm-outline__item.is-drop {
  box-shadow: inset 0 2px 0 var(--c-accent);
}

.adm-outline__no {
  flex: none;
  width: 18px;
  padding-top: 1px;
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
}

.adm-outline__main {
  flex: 1;
  min-width: 0;
  padding-right: var(--sp-6);
}

.adm-outline__title {
  display: -webkit-box;
  overflow: hidden;
  color: var(--c-ink);
  font-size: var(--fs-sub);
  line-height: 1.45;
  word-break: break-word;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.adm-outline__item.is-active .adm-outline__title {
  color: var(--c-accent-ink);
}

.adm-outline__meta {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 1px;
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: 1.5;
}

.adm-outline__reqdot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--c-accent);
  flex: none;
}

.adm-outline__acts {
  position: absolute;
  top: 50%;
  right: var(--sp-1);
  display: flex;
  gap: 0;
  opacity: 0;
  transform: translateY(-50%);
  transition: opacity var(--dur-fast);
}

.adm-outline__item:hover .adm-outline__acts,
.adm-outline__item:focus-within .adm-outline__acts,
.adm-outline__item.is-active .adm-outline__acts {
  opacity: 1;
}

.adm-iconbtn {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: var(--r-1);
  color: var(--c-ink-3);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.adm-iconbtn:hover {
  background: var(--c-sheet-3);
  color: var(--c-ink);
}
.adm-iconbtn:disabled {
  opacity: 0.3;
  cursor: default;
}
.adm-iconbtn--danger:hover {
  background: var(--c-danger-soft);
  color: var(--c-danger);
}

.adm-outline__foot {
  display: flex;
  flex: none;
  flex-direction: column;
  gap: 2px;
  padding: var(--sp-2);
  border-top: 1px solid var(--c-line);
}

.adm-addbtn {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  height: 36px;
  padding: 0 var(--sp-3);
  border: 1px dashed var(--c-line-3);
  border-radius: var(--r-2);
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  transition: border-color var(--dur-fast), background var(--dur-fast), color var(--dur-fast);
}
.adm-addbtn:hover {
  border-color: var(--c-accent-line);
  background: var(--c-accent-soft);
  color: var(--c-accent-ink);
}

.adm-addbtn--quiet {
  height: 32px;
  border-color: transparent;
  color: var(--c-ink-2);
}
.adm-addbtn--quiet:hover {
  background: var(--c-sheet-3);
  color: var(--c-ink);
}
.adm-addbtn--quiet.is-active {
  background: var(--c-accent-soft);
  color: var(--c-accent-ink);
}

/* 中：纸面 */

.adm-canvas {
  display: flex;
  flex: 1;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  padding: var(--sp-6) var(--sp-6) var(--sp-10);
  overflow-y: auto;
  background: var(--c-paper);
  scrollbar-width: thin;
}

.adm-paper {
  align-self: flex-start;
  width: 100%;
  max-width: var(--adm-paper-max);
  padding: var(--sp-10) var(--sp-8) var(--sp-8);
  border: 1px solid var(--c-line);
  border-radius: var(--r-4);
  background: var(--c-sheet);
  box-shadow: var(--sh-1);
}

.adm-paper__cover {
  margin: calc(-1 * var(--sp-3)) calc(-1 * var(--sp-4)) var(--sp-6);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-3);
  cursor: pointer;
  transition: background var(--dur-fast), box-shadow var(--dur-fast);
}

.adm-paper__cover:hover {
  background: var(--c-sheet-2);
}

.adm-paper__cover.is-active {
  background: var(--c-accent-soft);
  box-shadow: inset 2px 0 0 var(--c-accent);
}

.adm-paper__eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: var(--lh-micro);
  letter-spacing: 0.08em;
}

.adm-paper__title {
  margin-top: var(--sp-2);
  color: var(--c-ink);
  font-size: var(--fs-h2);
  font-weight: var(--fw-semi);
  line-height: var(--lh-h2);
  word-break: break-word;
}

.adm-paper__sub {
  margin-top: var(--sp-1);
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  line-height: var(--lh-sub);
}

.adm-paper__intro {
  max-width: 48em;
  margin-top: var(--sp-3);
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  line-height: 1.75;
}

.adm-paper__rule {
  height: 1px;
  margin: var(--sp-6) 0 var(--sp-5);
  background: var(--c-line-2);
}

.adm-paper__list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.adm-qcard {
  position: relative;
  padding: var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-5);
  border: 1px solid var(--c-line);
  border-radius: var(--r-3);
  background: var(--c-sheet);
  cursor: pointer;
  transition: border-color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-fast);
}

.adm-qcard:hover {
  border-color: var(--c-line-3);
}

.adm-qcard.is-active {
  border-color: var(--c-accent-line);
  background: var(--c-accent-soft);
  box-shadow: inset 2px 0 0 var(--c-accent);
}

.adm-qcard__head {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-2);
}

.adm-qcard__no {
  flex: none;
  width: var(--adm-num-w);
  padding-top: 2px;
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}

.adm-qcard__title {
  flex: 1;
  min-width: 0;
  color: var(--c-ink);
  font-size: var(--fs-body);
  font-weight: var(--fw-med);
  line-height: 1.6;
  word-break: break-word;
}

.adm-qcard__req {
  margin-left: 2px;
  color: var(--c-danger);
  font-weight: var(--fw-semi);
}

.adm-qcard__type {
  flex: none;
  padding-top: 2px;
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.06em;
  white-space: nowrap;
}

.adm-qcard__body {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  margin-top: var(--sp-3);
  padding-left: calc(var(--adm-num-w) + var(--sp-2));
}

.adm-qcard__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
  padding-left: calc(var(--adm-num-w) + var(--sp-2));
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
}

.adm-optline {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: 28px;
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  line-height: var(--lh-sub);
}

.adm-optline__mark {
  width: 14px;
  height: 14px;
  border: 1px solid var(--c-line-3);
  border-radius: 50%;
  background: var(--c-sheet);
  flex: none;
}

.adm-optline__mark--box {
  border-radius: var(--r-1);
}

.adm-optline__text {
  min-width: 0;
  word-break: break-word;
}

.adm-blankline {
  display: flex;
  align-items: flex-end;
  width: 100%;
  max-width: 300px;
  height: 30px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--c-line-3);
  color: var(--c-ink-4);
  font-size: var(--fs-sub);
}

.adm-blankline--short {
  max-width: 200px;
}

.adm-siminput {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 190px;
  max-width: 100%;
  height: 32px;
  padding: 0 var(--sp-3);
  border: 1px solid var(--c-line);
  border-radius: var(--r-2);
  background: var(--c-sheet-2);
  color: var(--c-ink-4);
  font-size: var(--fs-sub);
}

.adm-uploadtile {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  width: 168px;
  height: 74px;
  border: 1px dashed var(--c-line-3);
  border-radius: var(--r-2);
  background: var(--c-sheet-2);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
}

.adm-paper__foot {
  margin-top: var(--sp-6);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.06em;
  text-align: center;
}

/* 右：属性面板 */

.adm-props {
  display: flex;
  flex: none;
  flex-direction: column;
  width: var(--adm-props-w);
  min-height: 0;
  border-left: 1px solid var(--c-line);
  background: var(--c-sheet);
}

.adm-props__head {
  display: flex;
  flex: none;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--c-line-2);
}

.adm-props__title {
  color: var(--c-ink);
  font-size: var(--fs-sub);
  font-weight: var(--fw-semi);
}

.adm-props__index {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
}

.adm-props__body {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: var(--sp-4);
  min-height: 0;
  padding: var(--sp-4) var(--sp-5) var(--sp-8);
  overflow-y: auto;
  scrollbar-width: thin;
}

.adm-props .textarea {
  min-height: 72px;
}

.adm-switchrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-3) 0;
  border-top: 1px solid var(--c-line-2);
}

.adm-switchrow__text {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.adm-switchrow__label {
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  font-weight: var(--fw-med);
}

.adm-switchrow__hint {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: 1.5;
}

.adm-points {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: calc(-1 * var(--sp-2));
}

.adm-points .input {
  width: 96px;
  height: 34px;
}

.adm-points__unit {
  color: var(--c-ink-3);
  font-size: var(--fs-sub);
}

.adm-props__section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  padding-top: var(--sp-4);
  border-top: 1px solid var(--c-line-2);
}

.adm-props__section-title {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.1em;
}

.adm-props__section-count {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  font-variant-numeric: tabular-nums;
}

.adm-optlist {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.adm-opt {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.adm-opt__no {
  flex: none;
  width: 14px;
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: 1;
}

.adm-opt .input {
  height: 34px;
  padding: 0 var(--sp-2);
}

.adm-opt__acts {
  display: flex;
  flex: none;
  gap: 0;
}

.adm-addopt {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  align-self: flex-start;
  height: 30px;
  padding: 0 var(--sp-2);
  border-radius: var(--r-1);
  color: var(--c-ink-2);
  font-size: var(--fs-cap);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.adm-addopt:hover {
  background: var(--c-sheet-3);
  color: var(--c-ink);
}

.adm-props__hint {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: 1.6;
}

.adm-props__danger {
  margin-top: var(--sp-1);
  padding-top: var(--sp-4);
  border-top: 1px solid var(--c-line-2);
}

.adm-dangerbtn {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  height: 34px;
  padding: 0 var(--sp-2);
  border-radius: var(--r-1);
  color: var(--c-danger);
  font-size: var(--fs-sub);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.adm-dangerbtn:hover {
  background: var(--c-danger-soft);
}

.adm-metalist {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding-top: var(--sp-4);
  border-top: 1px solid var(--c-line-2);
}

.adm-metalist__row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: 1.6;
}

.adm-metalist__row b {
  color: var(--c-ink-2);
  font-weight: var(--fw-med);
  font-variant-numeric: tabular-nums;
}

/* ── 5. 弹层（自建，避免与外壳 modal 的状态耦合） ───────────────────────── */

.adm-dialog {
  position: absolute;
  inset: 0;
  z-index: var(--z-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-6);
}

.adm-dialog__scrim {
  position: absolute;
  inset: 0;
  background: var(--c-scrim);
  animation: fade-in var(--dur) var(--ease-out);
}

.adm-dialog__panel {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(560px, 100%);
  max-height: calc(100% - var(--sp-6));
  border: 1px solid var(--c-line);
  border-radius: var(--r-4);
  background: var(--c-sheet);
  box-shadow: var(--sh-3);
  animation: modal-in var(--dur) var(--ease-out);
}

.adm-dialog--preview .adm-dialog__panel {
  width: auto;
  max-width: calc(100% - var(--sp-6));
}

.adm-dialog__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-4);
  padding: var(--sp-5) var(--sp-5) 0;
}

.adm-dialog__title {
  color: var(--c-ink);
  font-size: var(--fs-h2);
  font-weight: var(--fw-semi);
  line-height: var(--lh-h2);
}

.adm-dialog__sub {
  margin-top: var(--sp-1);
  color: var(--c-ink-3);
  font-size: var(--fs-sub);
  line-height: var(--lh-sub);
}

.adm-dialog__body {
  padding: var(--sp-4) var(--sp-5);
  overflow: auto;
  scrollbar-width: thin;
}

.adm-dialog--preview .adm-dialog__body {
  padding: var(--sp-4) var(--sp-6) var(--sp-5);
}

.adm-dialog__foot {
  display: flex;
  flex: none;
  justify-content: flex-end;
  gap: var(--sp-2);
  padding: var(--sp-4) var(--sp-5) var(--sp-5);
  border-top: 1px solid var(--c-line-2);
}

.adm-dialog__close {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: var(--r-2);
  color: var(--c-ink-3);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.adm-dialog__close:hover {
  background: var(--c-sheet-3);
  color: var(--c-ink);
}

/* 新建问卷表单 */

.adm-form {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.adm-form__row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-4);
}

/* 手机预览 */

.adm-preview {
  display: flex;
  justify-content: center;
}

.adm-phone {
  display: flex;
  flex-direction: column;
  width: 360px;
  max-width: 100%;
  height: 620px;
  overflow: hidden;
  border: 1px solid var(--c-line-3);
  border-radius: var(--r-4);
  background: var(--c-paper);
  box-shadow: var(--sh-2);
}

.adm-phone__head {
  display: flex;
  flex: none;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  height: 38px;
  padding: 0 var(--sp-4);
  border-bottom: 1px solid var(--c-line);
  background: var(--c-sheet);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.06em;
}

.adm-phone__scroll {
  flex: 1;
  min-height: 0;
  padding: var(--sp-6) var(--sp-5) var(--sp-8);
  overflow-y: auto;
  scrollbar-width: thin;
}

.adm-phone__foot {
  flex: none;
  padding: 10px var(--sp-4);
  border-top: 1px solid var(--c-line);
  background: var(--c-sheet);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  text-align: center;
}

.adm-pv__cover {
  padding-bottom: var(--sp-5);
  border-bottom: 1px solid var(--c-line-2);
}

.adm-pv__eyebrow {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  line-height: var(--lh-micro);
  letter-spacing: 0.08em;
}

.adm-pv__title {
  margin-top: var(--sp-2);
  color: var(--c-ink);
  font-size: var(--fs-h1);
  font-weight: var(--fw-semi);
  line-height: var(--lh-h1);
  letter-spacing: var(--ls-tight);
}

.adm-pv__sub {
  margin-top: var(--sp-1);
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  line-height: var(--lh-sub);
}

.adm-pv__intro {
  margin-top: var(--sp-3);
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  line-height: 1.75;
}

.adm-pv__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-1) var(--sp-2);
  margin-top: var(--sp-4);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
}

.adm-pv__q {
  padding: var(--sp-5) 0;
  border-bottom: 1px solid var(--c-line-2);
}

.adm-pv__q:last-child {
  border-bottom: 0;
}

.adm-pv__qhead {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
}

.adm-pv__no {
  flex: none;
  width: 18px;
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  font-variant-numeric: tabular-nums;
}

.adm-pv__qtitle {
  flex: 1;
  min-width: 0;
  color: var(--c-ink);
  font-size: var(--fs-body);
  font-weight: var(--fw-med);
  line-height: 1.6;
  word-break: break-word;
}

.adm-pv__hint {
  margin-top: var(--sp-1);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
}

.adm-pv__opts {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: var(--sp-3);
  padding-left: calc(18px + var(--sp-2));
}

.adm-pv__opt {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: 42px;
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  cursor: pointer;
}

.adm-pv__opt input {
  width: 17px;
  height: 17px;
  margin: 0;
  accent-color: var(--c-accent);
  flex: none;
}

.adm-pv__field {
  margin-top: var(--sp-3);
  padding-left: calc(18px + var(--sp-2));
}

.adm-pv__field .textarea {
  min-height: 88px;
}

.adm-pv__fake {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  height: 44px;
  padding: 0 var(--sp-3);
  border: 1px solid var(--c-line);
  border-radius: var(--r-3);
  background: var(--c-sheet);
  color: var(--c-ink-4);
  font-size: var(--fs-sub);
}

.adm-pv__upload {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  width: 100%;
  height: 104px;
  border: 1px dashed var(--c-line-3);
  border-radius: var(--r-2);
  background: var(--c-sheet-2);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
}

/* ── 6. 桌面登录 ─────────────────────────────────────────────────────────── */

.adm-login {
  display: grid;
  flex: 1;
  grid-template-columns: 1.04fr 0.96fr;
  min-height: 0;
}

.adm-login__brand {
  display: flex;
  flex-direction: column;
  padding: var(--sp-12) var(--sp-12) var(--sp-10);
  border-right: 1px solid var(--c-line);
  background: var(--c-paper);
}

.adm-login__brandhead {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}

.adm-login__mark {
  display: grid;
  flex: none;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--r-2);
  background: var(--c-accent);
  color: var(--c-sheet);
  font-size: 19px;
  font-weight: var(--fw-semi);
  line-height: 1;
}

.adm-login__wordmark {
  font-size: var(--fs-h2);
  font-weight: var(--fw-semi);
  letter-spacing: var(--ls-tight);
  line-height: 1.3;
}

.adm-login__brandsub {
  margin-top: 2px;
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.12em;
}

.adm-login__brandbody {
  display: flex;
  flex: 1;
  flex-direction: column;
  justify-content: center;
  gap: var(--sp-6);
  min-height: 0;
}

.adm-login__claim {
  max-width: 22em;
  color: var(--c-ink);
  font-size: var(--fs-display);
  font-weight: var(--fw-semi);
  line-height: 1.5;
  letter-spacing: var(--ls-tight);
}

.adm-login__rule {
  width: 40px;
  height: 1px;
  background: var(--c-line-3);
}

.adm-login__brandmeta {
  margin-top: calc(-1 * var(--sp-3));
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.08em;
}

/* 登录页的纸面实物标本 */
.adm-specimen {
  width: 340px;
  max-width: 100%;
  padding: var(--sp-5);
  border: 1px solid var(--c-line);
  border-radius: var(--r-3);
  background: var(--c-sheet);
  box-shadow: var(--sh-1);
}

.adm-specimen__eyebrow {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.08em;
}

.adm-specimen__q {
  margin-top: var(--sp-3);
  color: var(--c-ink);
  font-size: var(--fs-sub);
  font-weight: var(--fw-med);
}

.adm-specimen__opts {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-4);
  margin-top: var(--sp-2);
}

.adm-specimen__opt {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--c-ink-2);
  font-size: var(--fs-micro);
}

.adm-specimen__mark {
  width: 11px;
  height: 11px;
  border: 1px solid var(--c-line-3);
  border-radius: 50%;
  flex: none;
}

.adm-specimen__rule {
  height: 1px;
  margin: var(--sp-4) 0 var(--sp-3);
  background: var(--c-line-2);
}

.adm-specimen__foot {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.04em;
}

.adm-login__brandfoot {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.04em;
}

.adm-login__form {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-12) var(--sp-16);
  background: var(--c-sheet);
}

.adm-login__forminner {
  width: 100%;
  max-width: 360px;
}

.adm-login__eyebrow {
  color: var(--c-ink-3);
  font-size: var(--fs-micro);
  letter-spacing: 0.12em;
}

.adm-login__title {
  margin-top: var(--sp-2);
  color: var(--c-ink);
  font-size: var(--fs-h1);
  font-weight: var(--fw-semi);
  line-height: var(--lh-h1);
  letter-spacing: -0.01em;
}

.adm-login__sub {
  margin-top: var(--sp-2);
  color: var(--c-ink-2);
  font-size: var(--fs-sub);
  line-height: var(--lh-sub);
}

.adm-login__notice {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  margin-top: var(--sp-5);
  padding: 10px var(--sp-3);
  border: 1px solid var(--c-line);
  border-radius: var(--r-2);
  background: var(--c-sheet-2);
  color: var(--c-ink-3);
  font-size: var(--fs-cap);
}

.adm-login__notice b {
  color: var(--c-ink-2);
  font-weight: var(--fw-med);
}

.adm-login__link {
  color: var(--c-accent-ink);
  font-size: var(--fs-cap);
  white-space: nowrap;
}
.adm-login__link:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.adm-login__fields {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  margin-top: var(--sp-6);
}

.adm-login__pw {
  position: relative;
}

.adm-login__pw .input {
  padding-right: 46px;
}

.adm-login__eye {
  position: absolute;
  top: 50%;
  right: 5px;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: var(--r-1);
  color: var(--c-ink-3);
  transform: translateY(-50%);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.adm-login__eye:hover {
  background: var(--c-sheet-3);
  color: var(--c-ink);
}

.adm-login__error {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  margin-top: calc(-1 * var(--sp-2));
  color: var(--c-danger);
  font-size: var(--fs-cap);
  line-height: var(--lh-cap);
}

.adm-login__error[hidden] {
  display: none;
}

.adm-login__row {
