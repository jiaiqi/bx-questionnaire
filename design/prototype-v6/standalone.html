    filter: '<path d="M4 6h16l-6.2 7.2v5.4l-3.6 1.6v-7L4 6Z"/>',
    lock: '<rect x="5.2" y="10.5" width="13.6" height="9.5" rx="2"/><path d="M8.4 10.5V8a3.6 3.6 0 0 1 7.2 0v2.5"/>',
    spark: '<path d="M12 3.5c.6 4.4 1.7 5.5 6.1 6.1-4.4.6-5.5 1.7-6.1 6.1-.6-4.4-1.7-5.5-6.1-6.1 4.4-.6 5.5-1.7 6.1-6.1Z"/><path d="M18.5 15.5c.3 2 .8 2.5 2.8 2.8-2 .3-2.5.8-2.8 2.8-.3-2-.8-2.5-2.8-2.8 2-.3 2.5-.8 2.8-2.8Z"/>',
    'arrow-up': '<path d="M12 19.5V5M6 11l6-6 6 6"/>',
    'arrow-down': '<path d="M12 4.5V19M6 13l6 6 6-6"/>',
    download: '<path d="M12 4v10.5M7.5 10.5 12 15l4.5-4.5"/><path d="M4.5 17v2.5h15V17"/>',
    share: '<circle cx="6" cy="12" r="2.4"/><circle cx="17.5" cy="5.8" r="2.4"/><circle cx="17.5" cy="18.2" r="2.4"/><path d="M8.2 10.9l7-3.8M8.2 13.1l7 3.8"/>',
    paper: '<path d="M6 3.5h7.5l4.5 4.5v12.5H6V3.5Z"/><path d="M13.5 3.5V8H18"/><path d="M9 12h6M9 15.5h4"/>',
  }

  function icon(name, size) {
    const path = ICON_PATHS[name]
    const s = size || 20
    if (!path) return ''
    return (
      '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.75" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true" focusable="false">' + path + '</svg>'
    )
  }

  // ── 工具 ─────────────────────────────────────────────────────────────────

  const esc = (value) =>
    String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[ch]))

  const fmt = (n) => {
    const num = Number(n)
    if (!Number.isFinite(num)) return '0'
    return num.toLocaleString('zh-CN')
  }

  const pad = (n) => (n < 10 ? '0' + n : String(n))
  const now = () => {
    const d = new Date()
    return pad(d.getHours()) + ':' + pad(d.getMinutes())
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state))
    } catch (error) {
      /* 忽略不可写环境 */
    }
  }

  // ── 屏幕注册表与路由 ─────────────────────────────────────────────────────

  const screens = {}
  const GROUP_LABEL = { answer: '作答端', admin: '管理端', login: '登录' }
  const GROUP_DEFAULT = { answer: 'cover', admin: 'list', login: 'login-d' }
  const navStack = []
  let current = { id: null, params: {}, group: 'answer' }
  let pendingParams = {}
  let cleanup = null

  const Proto = {
    state,
    screens,
    register(id, def) {
      screens[id] = Object.assign({ id }, def)
    },
    go,
    back,
    rerender,
    toast,
    modal: openModal,
    confirm,
    icon,
    esc,
    fmt,
    save: persist,
    reset,
    boot,
  }
  window.Proto = Proto

  function go(id, params) {
    const def = screens[id]
    if (!def) {
      console.warn('[proto] 未注册的屏：' + id)
      return
    }
    if (current.id && current.id !== id) navStack.push(current.id)
    pendingParams = params || {}
    state.view[def.group] = id
    persist()
    const target = '#/' + def.group + '/' + id
    if (location.hash === target) render()
    else location.hash = target
  }

  function back() {
    while (navStack.length) {
      const id = navStack.pop()
      if (!screens[id]) continue
      pendingParams = {}
      const target = '#/' + screens[id].group + '/' + id
      if (location.hash === target) render()
      else location.hash = target
      return
    }
    const fallback = GROUP_DEFAULT[current.group] || 'cover'
    go(fallback)
  }

  function parseHash() {
    const raw = (location.hash || '').replace(/^#\/?/, '').trim()
    if (!raw) return null
    const parts = raw.split('/')
    if (parts.length === 1) return { group: null, id: parts[0] }
    return { group: parts[0], id: parts[1] }
  }

  function rerender() {
    const scroller = document.querySelector('.device__screen .screen')
    const top = scroller ? scroller.scrollTop : 0
    render(true)
    const next = document.querySelector('.device__screen .screen')
    if (next) next.scrollTop = top
  }

  // ── 渲染 ─────────────────────────────────────────────────────────────────

  const frameEl = () => document.getElementById('frame')

  function deviceMarkup(group) {
    if (group === 'answer') {
      return (
        '<div class="device device--phone">' +
          '<div class="device__screen">' +
            '<div class="device__island"></div>' +
            '<div class="device__status">' +
              '<span class="tnum">9:41</span>' +
              '<span class="device__status-icons">' +
                '<span class="device__bar"><i></i><i></i><i></i><i></i></span>' +
                '<span class="device__battery"></span>' +
              '</span>' +
            '</div>' +
            '<div class="screen screen-anim" id="screen-body"></div>' +
          '</div>' +
        '</div>'
      )
    }
    const hashLabel = (location.hash || '').replace('#/', '')
    return (
      '<div class="device device--desktop">' +
        '<div class="device__titlebar">' +
          '<span class="device__dots"><i></i><i></i><i></i></span>' +
          '<span class="device__url"><b>quest.100xsys.cn</b>/quest/#' + esc(hashLabel) + '</span>' +
        '</div>' +
        '<div class="device__screen">' +
          '<div class="screen screen-anim" id="screen-body"></div>' +
        '</div>' +
      '</div>'
    )
  }

  function render(force) {
    const parsed = parseHash()
    let id = parsed && parsed.id
    let def = screens[id]

    if (!def) {
      const group = (parsed && parsed.group) || 'answer'
      id = GROUP_DEFAULT[group] || 'cover'
      def = screens[id]
      if (!def) return
      location.replace('#/' + (GROUP_DEFAULT[id] ? group : def.group) + '/' + id)
    }

    if (!force && current.id === id && !pendingParams) {
      // 同一屏重复 render 无害，但避免重复动画
    }

    if (cleanup) {
      try { cleanup() } catch (error) { /* 忽略清理异常 */ }
      cleanup = null
    }

    current = { id, group: def.group, params: pendingParams }
    const params = pendingParams
    pendingParams = {}

    const ctx = makeContext(def, params)
    const wrap = frameEl()
    wrap.innerHTML = deviceMarkup(def.group)
    fitDevice()

    const body = document.getElementById('screen-body')
    let html = ''
    try {
      html = def.render(ctx) || ''
    } catch (error) {
      console.error('[proto] 屏 ' + id + ' 渲染失败', error)
      html =
        '<div class="empty"><div class="empty__title">这一屏渲染失败了</div>' +
        '<div class="empty__tip">' + esc(error && error.message ? error.message : String(error)) + '</div></div>'
    }
    body.innerHTML = html

    if (typeof def.mount === 'function') {
      try {
        cleanup = def.mount(body, ctx) || null
      } catch (error) {
        console.error('[proto] 屏 ' + id + ' 绑定失败', error)
      }
    }

    updateChrome(def)
    requestAnimationFrame(fitDevice)
  }

  function makeContext(def, params) {
    return {
      state,
      params,
      group: def.group,
      go,
      back,
      rerender,
      save: persist,
      toast,
      modal: openModal,
      confirm,
      icon,
      esc,
      fmt,
      now,
    }
  }

  function updateChrome(def) {
    document.querySelectorAll('[data-group]').forEach((el) => {
      const active = el.getAttribute('data-group') === def.group
      el.classList.toggle('is-active', active)
      el.setAttribute('aria-selected', active ? 'true' : 'false')
    })
    const label = document.querySelector('.proto__caption-label')
    const note = document.querySelector('.proto__caption-note')
    if (label) label.textContent = def.label || def.id
    if (note) note.textContent = def.note || ''
    document.title = '园区问卷 · ' + (def.label || def.id)
  }

  // ── 设备框适配 ───────────────────────────────────────────────────────────

  function fitDevice() {
    const stage = document.querySelector('.proto__stage')
    const wrap = frameEl()
    if (!stage || !wrap) return
    const device = wrap.firstElementChild
    if (!device) return

    const isPhone = device.classList.contains('device--phone')
    const naturalW = isPhone ? 410 : 1322
    const naturalH = isPhone ? 800 : 920

    const availW = stage.clientWidth - 32
    const availH = stage.clientHeight - 120

    let scale = availW / naturalW
    if (isPhone) scale = Math.min(scale, availH / naturalH)
    scale = Math.max(0.52, Math.min(1, scale || 1))

    device.style.transform = 'scale(' + scale + ')'
    wrap.style.width = Math.round(naturalW * scale) + 'px'
    wrap.style.height = Math.round(naturalH * scale) + 'px'
  }

  // ── toast / modal ────────────────────────────────────────────────────────

  function toast(text, type) {
    const host = document.getElementById('toasts')
    if (!host) return
    const el = document.createElement('div')
    el.className = 'toast' + (type && type !== 'info' ? ' toast--' + type : '')
    el.setAttribute('role', 'status')
    el.innerHTML = icon(type === 'warn' ? 'close' : 'check', 16) + '<span>' + esc(text) + '</span>'
    host.appendChild(el)
    setTimeout(() => {
      el.classList.add('is-out')
      setTimeout(() => el.remove(), 220)
    }, 2200)
  }

  let closeActiveModal = null

  function openModal(options) {
    const opts = options || {}
    return new Promise((resolve) => {
      const host = document.getElementById('modal')
      if (!host) return resolve('cancel')
      if (closeActiveModal) closeActiveModal('cancel')

      const actions = opts.actions || [
        { label: '取消', value: 'cancel', variant: 'quiet' },
        { label: '确认', value: 'confirm', variant: 'primary' },
      ]
      const buttons = actions
        .map((action) => {
          const variant = action.variant === 'primary'
            ? ' btn--primary'
            : action.variant === 'danger'
              ? ' btn--danger'
              : action.variant === 'ghost'
                ? ' btn--ghost'
                : ' btn--quiet'
          return (
            '<button type="button" class="btn' + variant + '" data-value="' +
            esc(action.value) + '">' + esc(action.label) + '</button>'
          )
        })
        .join('')

      host.innerHTML =
        '<div class="modal__scrim" data-close></div>' +
        '<div class="modal__panel' + (opts.wide ? ' modal__panel--wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
          '<div class="modal__head">' +
            '<div><div class="modal__title" id="modal-title">' + esc(opts.title || '') + '</div>' +
            (opts.sub ? '<div class="modal__sub">' + esc(opts.sub) + '</div>' : '') + '</div>' +
            '<button type="button" class="btn btn--icon" data-value="cancel" aria-label="关闭">' + icon('close', 18) + '</button>' +
          '</div>' +
          '<div class="modal__body">' + (opts.body || '') + '</div>' +
          '<div class="modal__foot">' + buttons + '</div>' +
        '</div>'
      host.classList.add('is-open')

      const lastFocus = document.activeElement
      const panel = host.querySelector('.modal__panel')
      const focusables = () =>
        Array.from(panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
          .filter((el) => !el.disabled && el.offsetParent !== null)

      function finish(value) {
        document.removeEventListener('keydown', onKey, true)
        host.classList.remove('is-open')
        host.innerHTML = ''
        closeActiveModal = null
        if (lastFocus && lastFocus.focus) lastFocus.focus()
        resolve(value)
      }

      function onKey(event) {
        if (event.key === 'Escape') {
          event.preventDefault()
          finish('cancel')
          return
        }
        if (event.key !== 'Tab') return
        const list = focusables()
        if (!list.length) return
        const first = list[0]
        const last = list[list.length - 1]
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault()
          last.focus()
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault()
          first.focus()
        }
      }

      closeActiveModal = finish
      host.querySelectorAll('[data-value]').forEach((el) => {
        el.addEventListener('click', () => finish(el.getAttribute('data-value')))
      })
      host.querySelector('[data-close]').addEventListener('click', () => finish('cancel'))
      document.addEventListener('keydown', onKey, true)
      const firstButton = focusables()[0]
      if (firstButton) firstButton.focus()
    })
  }

  function confirm(options) {
    const opts = options || {}
    return openModal({
      title: opts.title || '确认操作',
      body:
        '<p class="sub" style="margin:0">' + esc(opts.body || '') + '</p>' +
        (opts.hint ? '<p class="cap" style="margin:var(--sp-3) 0 0">' + esc(opts.hint) + '</p>' : ''),
      actions: [
        { label: opts.cancelText || '取消', value: 'cancel', variant: 'quiet' },
        {
          label: opts.confirmText || '确认',
          value: 'confirm',
          variant: opts.danger ? 'danger' : 'primary',
        },
      ],
    }).then((value) => value === 'confirm')
  }

  // ── 顶栏 / 目录 / 重置 ───────────────────────────────────────────────────

  function boot() {
    const tabs = document.getElementById('tabs')
    if (tabs) {
      tabs.innerHTML =
        '<div class="seg" role="tablist" aria-label="切换端">' +
          Object.keys(GROUP_LABEL)
            .map(
              (group) =>
                '<button type="button" class="seg__item" role="tab" aria-selected="false" data-group="' +
                group + '">' + GROUP_LABEL[group] + '</button>',
            )
            .join('') +
        '</div>'
      tabs.addEventListener('click', (event) => {
        const btn = event.target.closest('[data-group]')
        if (!btn) return
        const group = btn.getAttribute('data-group')
        go(state.view[group] || GROUP_DEFAULT[group])
      })
    }

    const catalog = document.getElementById('catalog')
    const openCatalog = () => {
      if (!catalog) return
      catalog.innerHTML = catalogMarkup()
      catalog.classList.add('is-open')
      catalog.querySelector('.catalog__scrim').addEventListener('click', closeCatalog)
      catalog.querySelector('[data-catalog-close]').addEventListener('click', closeCatalog)
      catalog.querySelectorAll('[data-screen-id]').forEach((btn) => {
        btn.addEventListener('click', () => {
          closeCatalog()
          go(btn.getAttribute('data-screen-id'))
        })
      })
      const active = catalog.querySelector('.catalog__item.is-active')
      if (active) active.focus()
    }
    const closeCatalog = () => {
      if (catalog) catalog.classList.remove('is-open')
    }

    document.getElementById('catalog-btn').addEventListener('click', openCatalog)
    document.getElementById('reset-btn').addEventListener('click', reset)
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && catalog && catalog.classList.contains('is-open')) closeCatalog()
    })

    window.addEventListener('resize', () => requestAnimationFrame(fitDevice))
    window.addEventListener('hashchange', () => {
      if (!parseHash()) {
        location.replace('#/answer/cover')
        return
      }
      render()
    })

    if (!parseHash()) location.replace('#/answer/cover')
    render()
  }

  function catalogMarkup() {
    const groups = ['answer', 'admin', 'login']
    return (
      '<div class="catalog__scrim"></div>' +
      '<aside class="catalog__panel" role="dialog" aria-modal="true" aria-label="屏幕目录">' +
        '<div class="catalog__head">' +
          '<div><div class="h3">屏幕目录</div><div class="cap">共 ' + Object.keys(screens).length + ' 屏</div></div>' +
          '<button type="button" class="btn btn--icon" data-catalog-close aria-label="关闭目录">' + icon('close', 18) + '</button>' +
        '</div>' +
        groups
          .map((group) => {
            const items = Object.keys(screens).filter((id) => screens[id].group === group)
            if (!items.length) return ''
            return (
              '<section class="catalog__group">' +
                '<div class="catalog__group-title">' + GROUP_LABEL[group] + '</div>' +
                items
                  .map(
                    (id) =>
                      '<button type="button" class="catalog__item' + (current.id === id ? ' is-active' : '') +
                      '" data-screen-id="' + id + '">' +
                        '<span class="catalog__item-label">' + esc(screens[id].label || id) + '</span>' +
                        '<span class="catalog__item-note">' + esc(screens[id].note || '') + '</span>' +
                      '</button>',
                  )
                  .join('') +
              '</section>'
            )
          })
          .join('') +
      '</aside>'
    )
  }

  async function reset() {
    const ok = await confirm({
      title: '重置原型数据',
      body: '作答内容、列表数据与设计器改动都会回到初始状态。',
      confirmText: '重置',
      danger: true,
    })
    if (!ok) return
    state = seed()
    Proto.state = state
    navStack.length = 0
    try { localStorage.removeItem(STORAGE_KEY) } catch (error) { /* 忽略 */ }
    location.hash = '#/answer/cover'
    render()
    toast('已重置', 'ok')
  }

  // 暴露给模块内部使用
  Proto.__internal = { fitDevice, render, deviceMarkup }

  // 各屏 JS 在本文件之后同步加载；DOMContentLoaded 时它们都已注册完成
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot)
  else boot()
})()


</script>

    浙江省: {

      宁波市: ['海曙区', '鄞州区'],

    },
  }

  // ── 作答数据计算 ─────────────────────────────────────────────────────────

  function isAnswered(value) {
    if (value == null) return false
    if (Array.isArray(value)) return value.length > 0
    return String(value).trim() !== ''
  }

  function countAnswered(survey, answers) {
    return survey.questions.filter((q) => isAnswered(answers[q.id])).length
  }

  function missingRequired(survey, answers) {
    return survey.questions.filter((q) => q.required && !isAnswered(answers[q.id]))
  }

  function sameSet(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b)) return false
    if (a.length !== b.length) return false
    const left = a.slice().sort()
    const right = b.slice().sort()
    return left.every((v, i) => v === right[i])
  }

  function computeResult(survey, answers) {
    let score = 0
    let total = 0
    let correct = 0
    let wrong = 0
    let unanswered = 0
    survey.questions.forEach((q) => {
      if (!q.points) return
      total += q.points
      const value = answers[q.id]
      if (!isAnswered(value)) {
        unanswered += 1
        return
      }
      const ok = Array.isArray(q.correct) ? sameSet(value, q.correct) : value === q.correct
      if (ok) {
        score += q.points
        correct += 1
      } else {
        wrong += 1
      }
    })
    return {
      score,
      total,
      correct,
      wrong,
      unanswered,
      submittedAt: nowStamp(),
      batchNo: batchStamp(),
    }
  }

  function buildReview(ctx, result, demo) {
    if (result.customReview) return result.customReview
    const survey = ctx.state.survey
    const answers = demo ? DEMO_ANSWERS : ctx.state.answers
    return survey.questions
      .filter((q) => q.points)
      .map((q) => {
        const value = answers[q.id]
        const empty = !isAnswered(value)
        const ok = !empty && (Array.isArray(q.correct) ? sameSet(value, q.correct) : value === q.correct)
        return {
          no: pad2(survey.questions.indexOf(q) + 1),
          title: q.title,
          mine: empty ? '未作答' : Array.isArray(value) ? value.join(' · ') : String(value),
          right: Array.isArray(q.correct) ? q.correct.join(' · ') : String(q.correct || '—'),
          score: ok ? q.points : 0,
          points: q.points,
          ok,
          note: q.type === 'checkbox' ? '多选题需全部选对才计分。' : '',
        }
      })
  }

  function questionBody(ctx, q, value, invalid) {
    const labelId = 't-' + q.id
    const errorId = 'e-' + q.id
    if (q.type === 'radio' || q.type === 'checkbox') {
      const options = q.options || []
      return (
        '<div class="ans-opts" role="' + (q.type === 'radio' ? 'radiogroup' : 'group') + '"' +
          ' aria-labelledby="' + labelId + '" aria-describedby="' + errorId + '"' +
          (invalid ? ' aria-invalid="true"' : '') + '>' +
          options
            .map((opt) => {
              const checked = q.type === 'radio' ? value === opt : Array.isArray(value) && value.indexOf(opt) >= 0
              return (
                '<label class="ans-opt' + (q.type === 'checkbox' ? ' ans-opt--check' : '') + '">' +
                  '<input class="ans-opt__input" type="' + (q.type === 'checkbox' ? 'checkbox' : 'radio') + '"' +
                    ' name="' + q.id + '" value="' + esc(opt) + '"' + (checked ? ' checked' : '') + '>' +
                  '<span class="ans-opt__mark" aria-hidden="true">' +
                    (q.type === 'checkbox' ? ctx.icon('check', 12) : '') +
                  '</span>' +
                  '<span class="ans-opt__label">' + esc(opt) + '</span>' +
                '</label>'
              )
            })
            .join('') +
        '</div>'
      )
    }
    if (q.type === 'text') {
      return (
        '<div class="ans-input-wrap">' +
          '<input class="input ans-answer" type="text" id="f-' + q.id + '" data-qid="' + q.id + '"' +
            ' value="' + esc(value || '') + '" aria-labelledby="' + labelId + '"' +
            ' placeholder="' + esc(q.placeholder || '请输入') + '">' +
        '</div>'
      )
    }
    if (q.type === 'number') {
      return (
        '<div class="ans-input-wrap ans-num">' +
          '<input class="input ans-num__input ans-answer" type="text" inputmode="numeric" id="f-' + q.id + '"' +
            ' data-qid="' + q.id + '" data-numeric="1" value="' + esc(value || '') + '"' +
            ' aria-labelledby="' + labelId + '" placeholder="' + esc(q.placeholder || '请输入数字') + '">' +
          '<span class="ans-num__unit">年</span>' +
        '</div>'
      )
    }
    if (q.type === 'date') {
      return (
        '<div class="ans-date">' +
          '<input class="input ans-date__input" type="date" id="f-' + q.id + '" data-qid="' + q.id + '"' +
            ' value="' + esc(value || '') + '" aria-labelledby="' + labelId + '">' +
          '<span class="ans-date__icon">' + ctx.icon('calendar', 18) + '</span>' +
        '</div>'
      )
    }
    if (q.type === 'address' || q.type === 'ref') {
      return pickMarkup(ctx, q, value)
    }
    if (q.type === 'image') {
      return imageMarkup(ctx, q, value)
    }
    if (q.type === 'textarea') {
      const text = value || ''
      const max = q.maxLength || 200
      return (
        '<textarea class="textarea ans-textarea ans-answer" id="f-' + q.id + '" data-qid="' + q.id + '"' +
          ' maxlength="' + max + '" aria-labelledby="' + labelId + '"' +
          ' placeholder="可以写具体一点，例如餐饮、通勤、工位">' + esc(text) + '</textarea>' +
        '<div class="ans-count" data-count-wrap>' +
          '<span data-count>' + text.length + '</span> / ' + max +
        '</div>'
      )
    }
    return ''
  }

  function questionMarkup(ctx, q, index, invalidIds) {
    const invalid = invalidIds.has(q.id)
    const flags = []
    if (q.required) flags.push('<span class="ans-q__sep"></span><span class="ans-q__flag">必答</span>')
    if (q.points) {
      flags.push('<span class="ans-q__sep"></span><span class="ans-q__flag ans-q__flag--pts">计分 ' + q.points + ' 分</span>')
    }
    return (

  // ── 底部弹层 ─────────────────────────────────────────────────────────────

  function closeSheet(root) {
    if (root && typeof root.__ansSheet === 'function') root.__ansSheet()
  }

  function createSheet(root, options) {
    closeSheet(root)
    const proto = P()
    const opts = options || {}
    const parent = root.parentElement
    const insideDevice = parent && parent.classList.contains('device__screen')
    const host = insideDevice ? parent : document.body
    const layer = document.createElement('div')
    layer.className = 'ans-sheet-layer' + (insideDevice ? '' : ' ans-sheet-layer--fixed')
    layer.innerHTML =
      '<div class="ans-sheet__scrim" data-sheet-close></div>' +
      '<div class="ans-sheet" role="dialog" aria-modal="true" aria-labelledby="ans-sheet-title">' +
        '<div class="ans-sheet__grab"></div>' +
        '<div class="ans-sheet__head">' +
          '<h2 class="ans-sheet__title" id="ans-sheet-title">' + esc(opts.title || '') + '</h2>' +
          '<button type="button" class="ans-sheet__close" data-sheet-close aria-label="关闭">' +
            proto.icon('close', 18) +
          '</button>' +
        '</div>' +
        '<div class="ans-sheet__crumbs" data-sheet-crumbs hidden></div>' +
        '<div class="ans-sheet__body" data-sheet-body></div>' +
        '<div class="ans-sheet__foot" data-sheet-foot hidden></div>' +
      '</div>'
    host.appendChild(layer)

    const sheetEl = layer.querySelector('.ans-sheet')
    const body = layer.querySelector('[data-sheet-body]')
    const crumbs = layer.querySelector('[data-sheet-crumbs]')
    const foot = layer.querySelector('[data-sheet-foot]')
    const lastFocus = document.activeElement
    let closed = false

    const focusables = () =>
      Array.from(
        sheetEl.querySelectorAll(
          'button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])',
        ),
      ).filter((el) => el.offsetParent !== null)

    function close() {
      if (closed) return
      closed = true
      document.removeEventListener('keydown', onKey, true)
      layer.remove()
      root.__ansSheet = null
      if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus({ preventScroll: true })
      if (typeof opts.onClose === 'function') opts.onClose()
    }

    function onKey(event) {
      if (event.key === 'Escape') {
        event.preventDefault()
        close()
        return
      }
      if (event.key !== 'Tab') return
      const list = focusables()
      if (!list.length) return
      const first = list[0]
      const last = list[list.length - 1]
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault()
        last.focus()
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault()
        first.focus()
      }
    }

    layer.querySelectorAll('[data-sheet-close]').forEach((el) => el.addEventListener('click', close))
    document.addEventListener('keydown', onKey, true)
    root.__ansSheet = close
    requestAnimationFrame(() => {
      const first =
        body.querySelector('.ans-sheet__opt, button, input') || sheetEl.querySelector('.ans-sheet__close')
      if (first) first.focus({ preventScroll: true })
    })

    return {
      layer,
      body,
      crumbs,
      foot,
      setCrumbs(html) {
        crumbs.innerHTML = html || ''
        crumbs.hidden = !html
      },
      setFoot(html) {
        foot.innerHTML = html || ''
        foot.hidden = !html
      },
      close,
    }
  }

  function openAddressSheet(root, ctx, q, onPick) {
    const current = String(ctx.state.answers[q.id] || '')
    const parts = current.split(' ').filter(Boolean)
    let prov = parts[0] || ''
    let city = parts[1] || ''
    let dist = parts[2] || ''
    let level = prov ? (city ? (dist ? 2 : 1) : 0) : 0
    const sheet = createSheet(root, { title: '选择所在地区' })

    const crumb = (label, target, current2) =>
      '<button type="button" class="ans-crumb' + (current2 ? ' is-current' : '') + '" data-crumb="' + target + '">' +
        esc(label) +
      '</button>'

    const draw = () => {
      sheet.setCrumbs(
        crumb(prov || '省份', 0, level === 0) +
        '<span class="ans-crumb-sep">/</span>' +
        (prov ? crumb(city || '城市', 1, level === 1) : '<span class="ans-crumb is-disabled">城市</span>') +
        '<span class="ans-crumb-sep">/</span>' +
        (city ? crumb(dist || '区县', 2, level === 2) : '<span class="ans-crumb is-disabled">区县</span>'),
      )
      let items = []
      if (level === 0) {
        items = Object.keys(ADDRESS).map((v) => ({ v, on: v === prov }))
      } else if (level === 1) {
        items = Object.keys(ADDRESS[prov] || {}).map((v) => ({ v, on: v === city }))
      } else {
        items = (ADDRESS[prov] && ADDRESS[prov][city] ? ADDRESS[prov][city] : []).map((v) => ({
          v,
          on: v === dist,
        }))
      }
      if (!items.length) {
        sheet.body.innerHTML = '<p class="ans-sheet__empty">暂无地区数据</p>'
        return
      }
      sheet.body.innerHTML =
        '<div class="ans-sheet__list">' +
        items
          .map(
            (it) =>
              '<button type="button" class="ans-sheet__opt' + (it.on ? ' is-on' : '') + '" data-addr="' + esc(it.v) + '">' +
                '<span class="ans-sheet__opt-mark" aria-hidden="true"></span>' +
                '<span>' + esc(it.v) + '</span>' +
                '<span class="ans-sheet__opt-check" aria-hidden="true">' + ctx.icon('check', 16) + '</span>' +
              '</button>',
          )
          .join('') +
        '</div>'
      requestAnimationFrame(() => {
        const first = sheet.body.querySelector('.ans-sheet__opt')
        if (first) first.focus({ preventScroll: true })
      })
    }

    draw()

    sheet.body.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-addr]')
      if (!btn) return
      const value = btn.getAttribute('data-addr')
      if (level === 0) {
        prov = value
        city = ''
        dist = ''
        level = 1
        draw()
      } else if (level === 1) {
        city = value
        dist = ''
        level = 2
        draw()
      } else {
        dist = value
        onPick(prov + ' ' + city + ' ' + dist)
        sheet.close()
      }
    })

    sheet.crumbs.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-crumb]')
      if (!btn) return
      level = Number(btn.getAttribute('data-crumb'))
      if (level === 0) {
        city = ''
        dist = ''
      } else if (level === 1) {
        dist = ''
      }
      draw()
    })
  }

  function openRefSheet(root, ctx, q, onPick) {
    const current = ctx.state.answers[q.id]
    const sheet = createSheet(root, { title: '选择一份问卷' })

      onPick(btn.getAttribute('data-ref'))

    })
  }
