    const start = root.querySelector('[data-start]')
    if (start) start.addEventListener('click', () => ctx.go('survey'))

    const more = root.querySelector('[data-more]')
    if (more) {
      more.addEventListener('click', () => {
        const panel = root.querySelector('#cover-more')
        const open = more.getAttribute('aria-expanded') === 'true'
        more.setAttribute('aria-expanded', String(!open))
        if (panel) panel.hidden = open
      })
    }

    const view = root.querySelector('[data-view-result]')
    if (view) {
      view.addEventListener('click', () => {
        ctx.state.viewingResult = null
        ctx.go('result')
      })
    }

    const restart = root.querySelector('[data-restart]')
    if (restart) {
      restart.addEventListener('click', () => {
        resetAnswerState(ctx)
        ctx.go('survey')
        ctx.toast('已开始新的作答', 'ok')
      })
    }
  }

  function resetAnswerState(ctx) {
    ctx.state.answers = {}
    ctx.state.submitted = false
    ctx.state.result = null
    ctx.state.viewingResult = null
    ctx.state.draftSavedAt = ''
    ctx.state.submitInfo = null
    submitForm = null
    ctx.save()
  }

  // ── 2. 作答页 ────────────────────────────────────────────────────────────

  let saveTimer = null
  let submitTimer = null
  let submitForm = null

  function renderSurvey(ctx, options) {
    const opts = options || {}
    const s = ctx.state
    const survey = s.survey
    const answered = countAnswered(survey, s.answers)
    const missing = missingRequired(survey, s.answers)
    const showErrors = !!opts.invalid && missing.length > 0
    const invalidIds = new Set(showErrors ? missing.map((q) => q.id) : [])
    const total = survey.questions.length
    const pct = total ? (answered / total) * 100 : 0
    const errorList = showErrors ? missing : []

    return (
      '<div class="ans ans--survey">' +
        appbar(ctx, {
          title: survey.title,
          backTo: 'cover',
          action:
            '<button type="button" class="appbar__action" data-goto="records" aria-label="作答记录">' +
              ctx.icon('list', 18) +
            '</button>',
        }) +
        '<div class="ans-prog" data-prog>' +
          '<div class="ans-prog__row">' +
            '<span class="ans-prog__count">已答 <b data-answered>' + answered + '</b> / ' + total + '</span>' +
            '<span class="ans-prog__req" data-req>' +
              (missing.length ? '还剩 ' + missing.length + ' 道必答' : '必答已完成') +
            '</span>' +
            '<span class="ans-prog__save' + (s.draftSavedAt ? ' is-on' : '') + '" data-save>' +
              (s.draftSavedAt ? '已暂存 ' + esc(s.draftSavedAt) : '') +
            '</span>' +
          '</div>' +
          '<div class="progress" role="progressbar" data-progress aria-label="作答进度"' +
            ' aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + answered + '">' +
            '<span class="progress__fill" data-fill style="width:' + pct.toFixed(2) + '%"></span>' +
          '</div>' +
        '</div>' +
        '<div class="ans-page">' +
          '<div class="ans-alert" data-alert role="alert"' + (showErrors ? '' : ' hidden') + '>' +
            (showErrors ? alertInner(ctx, survey, errorList) : '') +
          '</div>' +
          '<div class="ans-qs">' +
            survey.questions
              .map((q, index) => questionMarkup(ctx, q, index, invalidIds))
              .join('') +
          '</div>' +
        '</div>' +
        '<div class="sticky-bar ans-submitbar">' +
          '<span class="sticky-bar__hint" data-barhint>草稿自动暂存</span>' +
          '<button type="button" class="btn btn--quiet ans-submitbar__draft" data-draft>暂存草稿</button>' +
          '<button type="button" class="btn btn--primary" data-submit>提交问卷</button>' +
        '</div>' +
      '</div>'
    )
  }

  function alertInner(ctx, survey, missing) {
    return (
      '<div class="ans-alert__head">' +
        ctx.icon('close', 16) +
        '<span data-alert-text>还有 ' + missing.length + ' 道必答没完成</span>' +
      '</div>' +
      '<ul class="ans-alert__list" data-alert-list>' +
      missing
        .map((q) => {
          const index = survey.questions.indexOf(q)
          return (
            '<li><button type="button" class="ans-alert__jump" data-jump="' + q.id + '">' +
              '<span class="tnum">' + pad2(index + 1) + '</span>' +
              '<span>' + esc(q.title) + '</span>' +
              ctx.icon('forward', 14) +
            '</button></li>'
          )
        })
        .join('') +
      '</ul>'
    )
  }

  function mountSurvey(root, ctx) {
    const state = ctx.state
    const survey = state.survey
    const answers = state.answers
    const byId = {}
    survey.questions.forEach((q) => {
      byId[q.id] = q
    })

    wireGoto(root, ctx)

    const saveEl = root.querySelector('[data-save]')
    const barhint = root.querySelector('[data-barhint]')

    function showSaved() {
      if (!saveEl) return
      saveEl.textContent = '已暂存 ' + state.draftSavedAt
      saveEl.classList.add('is-on')
      if (barhint) barhint.textContent = '已暂存 ' + state.draftSavedAt
    }

    function scheduleSave() {
      if (saveTimer) clearTimeout(saveTimer)
      saveTimer = setTimeout(() => {
        state.draftSavedAt = ctx.now ? ctx.now() : ''
        ctx.save()
        showSaved()
      }, 1200)
    }

    function refreshProgress() {
      const answered = countAnswered(survey, answers)
      const missing = missingRequired(survey, answers)
      const total = survey.questions.length
      const counted = root.querySelector('[data-answered]')
      if (counted) counted.textContent = answered
      const fill = root.querySelector('[data-fill]')
      if (fill) fill.style.width = (total ? (answered / total) * 100 : 0).toFixed(2) + '%'
      const bar = root.querySelector('[data-progress]')
      if (bar) bar.setAttribute('aria-valuenow', String(answered))
      const req = root.querySelector('[data-req]')
      if (req) {
        req.textContent = missing.length ? '还剩 ' + missing.length + ' 道必答' : '必答已完成'
        req.classList.toggle('is-done', missing.length === 0)
      }
      refreshAlert(missing)
    }

    function refreshAlert(missing) {
      const alert = root.querySelector('[data-alert]')
      if (!alert || alert.hidden) return
      if (!missing.length) {
        alert.hidden = true
        return
      }
      alert.innerHTML = alertInner(ctx, survey, missing)
    }

    function markInvalid(q) {
      const block = root.querySelector('#q-' + q.id)
      if (!block) return
      block.classList.add('is-invalid')
      const err = block.querySelector('[data-err]')
      if (err) {
        err.hidden = false
        err.innerHTML = ctx.icon('close', 14) + '<span>' + esc(errorTextFor(q)) + '</span>'
      }
      const group = block.querySelector('[role="radiogroup"], [role="group"]')
      if (group) group.setAttribute('aria-invalid', 'true')
      const single = block.querySelector('input, textarea, .ans-pick')
      if (single) single.setAttribute('aria-invalid', 'true')
    }

    function clearInvalid(qid) {
      const block = root.querySelector('#q-' + qid)
      if (!block) return
      block.classList.remove('is-invalid')
      const err = block.querySelector('[data-err]')
      if (err) {
        err.hidden = true
        err.innerHTML = ''
      }
      block.querySelectorAll('[aria-invalid]').forEach((el) => el.removeAttribute('aria-invalid'))
    }

    function setAnswer(qid, value) {
      answers[qid] = value
      clearInvalid(qid)
      refreshProgress()
      scheduleSave()
    }

    function applyPick(q, value) {
      setAnswer(q.id, value)
      const wrap = root.querySelector('.ans-pick-wrap[data-pick-wrap="' + q.id + '"]')
      if (wrap) {
        wrap.outerHTML = pickMarkup(ctx, q, value)
        const btn = root.querySelector('.ans-pick[data-pick="' + q.id + '"]')
        if (btn) btn.focus({ preventScroll: true })
      }
    }

    function focusQuestion(qid) {
      const block = root.querySelector('#q-' + qid)
      if (!block) return
      block.scrollIntoView({ behavior: scrollBehavior(), block: 'start' })
      const target = block.querySelector('.ans-opt__input, input, textarea, .ans-pick, button')
      if (target) {
        window.setTimeout(() => target.focus({ preventScroll: true }), 80)
      }
    }

    function submit() {
      const missing = missingRequired(survey, answers)
      const alert = root.querySelector('[data-alert]')
      if (missing.length) {
        if (alert) {
          alert.innerHTML = alertInner(ctx, survey, missing)
          alert.hidden = false
        }
        missing.forEach(markInvalid)
        focusQuestion(missing[0].id)
        ctx.toast('还有 ' + missing.length + ' 道必答没完成', 'warn')
        return
      }
      if (saveTimer) clearTimeout(saveTimer)
      ctx.go('submit')
    }

    function saveNow() {
      if (saveTimer) clearTimeout(saveTimer)
      state.draftSavedAt = ctx.now ? ctx.now() : ''
      ctx.save()
      showSaved()
      ctx.toast('草稿已保存', 'ok')
    }

    // 输入类
    root.addEventListener('input', (event) => {
      const target = event.target
      if (!target.classList || !target.classList.contains('ans-answer')) return
      const qid = target.getAttribute('data-qid')
      if (!qid) return
      let value = target.value
      if (target.getAttribute('data-numeric') === '1') {
        value = value.replace(/[^\d]/g, '').slice(0, 3)
        if (target.value !== value) target.value = value
      }
      setAnswer(qid, value)
      if (target.classList.contains('ans-textarea')) {
        const wrap = target.parentElement.querySelector('[data-count-wrap]')
        if (wrap) {
          const count = wrap.querySelector('[data-count]')
          if (count) count.textContent = value.length
          const max = Number(target.getAttribute('maxlength')) || 200
          wrap.classList.toggle('is-near-limit', value.length > max - 20)
        }
      }
    })

    // 选项 / 日期
    root.addEventListener('change', (event) => {
      const target = event.target
      if (target.classList.contains('ans-opt__input')) {
        const qid = target.getAttribute('name')
        const q = byId[qid]
        if (!q) return
        if (q.type === 'checkbox') {
          const list = Array.isArray(answers[qid]) ? answers[qid].slice() : []
          const index = list.indexOf(target.value)
          if (target.checked && index < 0) list.push(target.value)
          if (!target.checked && index >= 0) list.splice(index, 1)
          setAnswer(qid, list)
        } else {
          setAnswer(qid, target.value)
        }
        return
      }
      if (target.classList.contains('ans-date__input')) {
        setAnswer(target.getAttribute('data-qid'), target.value)
      }
    })

    // 点击：跳题 / 暂存 / 提交 / 弹层 / 图片 / 日期
    root.addEventListener('click', (event) => {
      const jump = event.target.closest('[data-jump]')
      if (jump) {
        focusQuestion(jump.getAttribute('data-jump'))
        return
      }
      if (event.target.closest('[data-draft]')) {
        saveNow()
        return
      }
      if (event.target.closest('[data-submit]')) {
        submit()
        return
      }
      const pick = event.target.closest('[data-pick]')
      if (pick) {
        const q = byId[pick.getAttribute('data-pick')]
        if (!q) return
        if (q.type === 'address') openAddressSheet(root, ctx, q, (value) => applyPick(q, value))
        else openRefSheet(root, ctx, q, (value) => applyPick(q, value))
        return
      }
      const clear = event.target.closest('[data-clear]')
      if (clear) {
        const q = byId[clear.getAttribute('data-clear')]
        if (q) applyPick(q, '')
        return
      }
      const imgAdd = event.target.closest('[data-img-add]')
      if (imgAdd) {
        const q = byId[imgAdd.getAttribute('data-img-add')]
        if (!q) return
        const wrap = root.querySelector('[data-img="' + q.id + '"]')
        if (wrap) wrap.classList.add('is-uploading')
        window.setTimeout(() => {
          if (!root.isConnected) return
          setAnswer(q.id, '工作环境-窗边.jpg')
          const current = root.querySelector('[data-img="' + q.id + '"]')
          if (current) {
            current.classList.remove('is-uploading')
            current.innerHTML = imageMarkup(ctx, q, '工作环境-窗边.jpg')
          }
        }, 320)
        return
      }
      const imgDel = event.target.closest('[data-img-del]')
      if (imgDel) {
        const q = byId[imgDel.getAttribute('data-img-del')]
        if (!q) return
        setAnswer(q.id, '')
        const current = root.querySelector('[data-img="' + q.id + '"]')
        if (current) current.innerHTML = imageMarkup(ctx, q, '')
        return
      }
      const dateWrap = event.target.closest('.ans-date')
      if (dateWrap) {
        const input = dateWrap.querySelector('.ans-date__input')
        if (input) {
          if (typeof input.showPicker === 'function') {
            try {
              input.showPicker()
            } catch (error) {
              input.focus()
            }
          } else {
            input.focus()
          }
        }
      }
    })

    return () => {
      if (saveTimer) {
        clearTimeout(saveTimer)
        saveTimer = null
      }
      closeSheet(root)
    }
  }

  // ── 3. 提交信息 ──────────────────────────────────────────────────────────

  function ensureSubmitForm(ctx) {
    if (submitForm) return submitForm
    const s = ctx.state
    submitForm = {
      name: (s.answers && s.answers.q1) || (s.session && s.session.loggedIn ? s.session.name : ''),
      dept: s.session && s.session.loggedIn ? s.session.dept : '',
      phone: '',
    }
    return submitForm
  }

  function renderSubmit(ctx) {
    const s = ctx.state
    const info = ensureSubmitForm(ctx)
    const deptOptions = ['技术部', '产品部', '市场部', '职能部', '其他']
    if (info.dept && deptOptions.indexOf(info.dept) < 0) deptOptions.unshift(info.dept)

    return (
      '<div class="ans ans--submit">' +
        appbar(ctx, { title: '提交信息', backTo: 'survey' }) +
        '<div class="ans-page ans-submit">' +
          '<div class="ans-lede">' +
            '<p class="ans-lede__kicker">最后一步</p>' +
            '<h1 class="ans-lede__title">确认你的联系信息</h1>' +
            '<p class="ans-lede__body">问卷本身是匿名的。下面三项只用于结果关联与必要回访，不会出现在公开报表里。</p>' +
          '</div>' +
          '<form class="ans-form" data-submit-form novalidate>' +
            '<div class="field" data-field="name">' +
              '<label class="field__label" for="sub-name">姓名<span class="field__req">必填</span></label>' +
              '<input class="input" id="sub-name" name="name" type="text" autocomplete="name"' +
                ' value="' + esc(info.name) + '" placeholder="请输入姓名">' +
              '<span class="field__error" data-err hidden></span>' +
            '</div>' +
            '<div class="field" data-field="dept">' +
              '<label class="field__label" for="sub-dept">部门<span class="field__req">必填</span></label>' +
              '<div class="ans-select">' +
                '<select class="select" id="sub-dept" name="dept">' +
                  '<option value="">请选择部门</option>' +
                  deptOptions
                    .map(
                      (dept) =>
                        '<option value="' + esc(dept) + '"' + (dept === info.dept ? ' selected' : '') + '>' +
                          esc(dept) +
                        '</option>',
                    )
                    .join('') +
                '</select>' +
                '<span class="ans-select__icon">' + ctx.icon('down', 16) + '</span>' +
              '</div>' +
              '<span class="field__error" data-err hidden></span>' +
            '</div>' +
            '<div class="field" data-field="phone">' +
              '<label class="field__label" for="sub-phone">手机号<span class="muted">选填</span></label>' +
              '<input class="input" id="sub-phone" name="phone" type="text" inputmode="numeric"' +
                ' maxlength="11" value="' + esc(info.phone) + '" placeholder="11 位手机号，用于必要时回访">' +
              '<span class="field__error" data-err hidden></span>' +
            '</div>' +
            '<div class="ans-note">' +
              '<span class="ans-note__icon">' + ctx.icon('lock', 18) + '</span>' +
              '<div>' +
                '<p class="ans-note__title">信息如何使用</p>' +
                '<p class="ans-note__body">姓名与部门用于核对同一岗位的作答分布；手机号仅在确有回访需求时使用，不用于营销，也不进入绩效评估。</p>' +
              '</div>' +
            '</div>' +
            '<div class="ans-form__actions">' +
              '<button type="submit" class="btn btn--primary btn--block" data-submit-info>提交问卷</button>' +
              '<button type="button" class="btn btn--quiet btn--block" data-goto="survey">返回继续作答</button>' +
            '</div>' +
            '<p class="ans-form__foot">提交后答案不可修改，可在作答记录里查看结果</p>' +
          '</form>' +
        '</div>' +
      '</div>'
    )
  }

  function mountSubmit(root, ctx) {
    wireGoto(root, ctx)
    const form = root.querySelector('[data-submit-form]')
    if (!form) return undefined
    const info = ensureSubmitForm(ctx)
    const nameEl = root.querySelector('#sub-name')
    const deptEl = root.querySelector('#sub-dept')
    const phoneEl = root.querySelector('#sub-phone')
    let busy = false

    const sync = () => {
      info.name = nameEl.value
      info.dept = deptEl.value
      info.phone = phoneEl.value
    }
    nameEl.addEventListener('input', sync)
    deptEl.addEventListener('change', sync)
    phoneEl.addEventListener('input', () => {
      const digits = phoneEl.value.replace(/[^\d]/g, '').slice(0, 11)
      if (phoneEl.value !== digits) phoneEl.value = digits
      sync()
    })

    function setError(fieldName, message) {
      const field = root.querySelector('[data-field="' + fieldName + '"]')
      if (!field) return
      field.classList.toggle('is-invalid', !!message)
      const err = field.querySelector('[data-err]')
      if (err) {
        err.hidden = !message
        err.innerHTML = message ? ctx.icon('close', 14) + '<span>' + esc(message) + '</span>' : ''
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault()
      if (busy) return
      const name = nameEl.value.trim()
      const dept = deptEl.value
      const phone = phoneEl.value.trim()
      let first = null
      setError('name', name ? '' : '请填写姓名')
      if (!name) first = first || nameEl
      setError('dept', dept ? '' : '请选择部门')
      if (!dept) first = first || deptEl
      const phoneBad = !!phone && !/^1\d{10}$/.test(phone)
      setError('phone', phoneBad ? '请填写 11 位手机号' : '')
      if (phoneBad) first = first || phoneEl
      if (first) {
        first.focus()
        return
      }

      busy = true
      const btn = root.querySelector('[data-submit-info]')
      btn.disabled = true
      btn.innerHTML = '<span class="ans-spin" aria-hidden="true"></span><span>正在提交</span>'
      ctx.toast('正在提交', 'info')

      submitTimer = window.setTimeout(() => {
        submitTimer = null
        const state = ctx.state
        state.submitInfo = { name: name, dept: dept, phone: phone, at: nowStamp() }
        if (!isAnswered(state.answers.q1)) state.answers.q1 = name
        state.submitted = true
        state.result = computeResult(state.survey, state.answers)
        state.viewingResult = null
        ctx.save()
        submitForm = null
        ctx.go('result')
        ctx.toast('提交成功', 'ok')
      }, 600)
    })

    return () => {
      if (submitTimer) {
        clearTimeout(submitTimer)
        submitTimer = null
      }
    }
  }

  // ── 4. 作答结果 ──────────────────────────────────────────────────────────

  const RING_C = 364.42

  function renderResult(ctx) {
    const s = ctx.state
    const viewing = s.viewingResult
    const result = viewing || s.result || DEMO_RESULT
    const demo = !viewing && !s.result
    const total = result.total || 20
    const score = result.score || 0
    const pct = total ? Math.max(0, Math.min(1, score / total)) : 0
    const review = buildReview(ctx, result, demo)
    const title = viewing ? viewing.title : s.survey.title
    const historical = !!result.historical
    const perfect = score >= total
    const suggest = perfect
      ? '全部计分题答对。把结果分享给同事，能帮助下一次问卷的回收。'
      : '多选题需要全部选对才计分。回看「薪酬福利」相关说明，再测一次通常就能拿到满分。'

    return (
      '<div class="ans ans--result">' +
        appbar(ctx, {
          title: '作答结果',
          backTo: 'cover',
          action:
            '<button type="button" class="appbar__action" data-goto="records" aria-label="作答记录">' +
              ctx.icon('list', 18) +
            '</button>',
        }) +
        '<div class="ans-page">' +
          '<div class="ans-result">' +
            '<div class="ans-status">' +
              '<span class="tag tag--ok"><span class="tag__dot"></span>已提交</span>' +
              '<span class="ans-status__meta">' + esc(result.submittedAt) + ' · ' + esc(result.batchNo) + '</span>' +
            '</div>' +
            '<div class="ans-hero">' +
              '<p class="ans-result__survey">' + esc(title) + '</p>' +
              '<p class="ans-hero__label">你的得分</p>' +
              '<div class="ans-ring">' +
                '<svg viewBox="0 0 132 132" aria-hidden="true" focusable="false">' +
                  '<circle class="ans-ring__track" cx="66" cy="66" r="58"></circle>' +
                  '<circle class="ans-ring__val" data-ring data-score="' + score + '" data-total="' + total +
                    '" cx="66" cy="66" r="58"></circle>' +
                '</svg>' +
                '<div class="ans-ring__center">' +
                  '<span class="ans-ring__score">' + score + '</span>' +
                  '<span class="ans-ring__total">/ ' + total + '</span>' +
                '</div>' +
              '</div>' +
              '<p class="ans-hero__cap">计分题 <span class="tnum">' + review.length + '</span> 道 · 满分 <span class="tnum">' + total + '</span> 分</p>' +
            '</div>' +
            '<div class="ans-stats">' +
              '<div class="ans-stat ans-stat--ok"><span class="ans-stat__num">' + (result.correct || 0) + '</span><span class="ans-stat__label">答对</span></div>' +
              '<div class="ans-stat ans-stat--bad"><span class="ans-stat__num">' + (result.wrong || 0) + '</span><span class="ans-stat__label">答错</span></div>' +
              '<div class="ans-stat"><span class="ans-stat__num">' + (result.unanswered || 0) + '</span><span class="ans-stat__label">未答</span></div>' +
            '</div>' +
            '<section class="ans-review">' +
              '<button type="button" class="ans-review__toggle" data-review-toggle aria-expanded="true" aria-controls="review-body">' +
                '<span class="ans-review__title">逐题回顾</span>' +
                '<span class="ans-review__meta tnum">' + review.length + ' 道计分题</span>' +
                ctx.icon('down', 16) +
              '</button>' +
              '<div class="ans-review__body" id="review-body" data-review-body>' +
                review.map((item) => reviewItemMarkup(item)).join('') +
              '</div>' +
            '</section>' +
            '<div class="ans-note ans-suggest">' +
              '<span class="ans-note__icon">' + ctx.icon('spark', 18) + '</span>' +
              '<div>' +
                '<p class="ans-suggest__title">下一步建议</p>' +
                '<p class="ans-suggest__body">' + esc(suggest) + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="ans-actions">' +
              (historical
                ? '<button type="button" class="btn btn--primary btn--block" data-goto="records">查看记录</button>' +
                  '<button type="button" class="btn btn--ghost btn--block" data-share>分享结果</button>'
                : '<button type="button" class="btn btn--primary btn--block" data-again>再测一次</button>' +
                  '<div class="ans-actions__row">' +
                    '<button type="button" class="btn btn--ghost" data-goto="records">查看记录</button>' +
                    '<button type="button" class="btn btn--ghost" data-share>分享</button>' +
                  '</div>') +
            '</div>' +
            '<p class="ans-foot">问卷编号 ' + esc(viewing ? viewing.no : s.survey.no) + ' · 截止 ' + esc(s.survey.deadline) + '</p>' +
          '</div>' +
        '</div>' +
      '</div>'
    )
  }

  function reviewItemMarkup(item) {
    const scoreClass = item.ok ? ' ans-rq__score--ok' : item.score > 0 ? '' : ' ans-rq__score--bad'
    const mineClass = item.ok ? ' is-ok' : item.score > 0 ? '' : ' is-bad'
    return (
      '<div class="ans-rq' + (item.ok ? '' : '') + '">' +
        '<div class="ans-rq__head">' +
          '<span class="ans-rq__no tnum">' + esc(item.no) + '</span>' +
          '<span class="ans-rq__title">' + esc(item.title) + '</span>' +
          '<span class="ans-rq__score tnum' + scoreClass + '">' + item.score + ' / ' + item.points + '</span>' +
        '</div>' +
        '<div class="ans-rq__cols">' +
          '<div class="ans-rq__col">' +
            '<span class="ans-rq__label">我的作答</span>' +
            '<span class="ans-rq__val' + mineClass + '">' + esc(item.mine) + '</span>' +
          '</div>' +
          '<div class="ans-rq__col">' +
            '<span class="ans-rq__label">正确答案</span>' +
            '<span class="ans-rq__val">' + esc(item.right) + '</span>' +
          '</div>' +
        '</div>' +
        (item.note ? '<p class="ans-rq__note">' + esc(item.note) + '</p>' : '') +
      '</div>'
    )
  }

  function mountResult(root, ctx) {
    wireGoto(root, ctx)

    const ring = root.querySelector('[data-ring]')
    if (ring) {
      const score = Number(ring.getAttribute('data-score')) || 0
      const total = Number(ring.getAttribute('data-total')) || 1
      const target = RING_C * (1 - Math.max(0, Math.min(1, score / total)))
      if (reduceMotion()) {
        ring.style.transition = 'none'
        ring.style.strokeDashoffset = String(target)
      } else {
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(() => {
            ring.style.strokeDashoffset = String(target)
          })
        })
      }
    }

    const toggle = root.querySelector('[data-review-toggle]')
    const body = root.querySelector('[data-review-body]')
    if (toggle && body) {
      toggle.addEventListener('click', () => {
        const open = toggle.getAttribute('aria-expanded') === 'true'
        toggle.setAttribute('aria-expanded', String(!open))
        body.hidden = open
      })
    }

    const again = root.querySelector('[data-again]')
    if (again) {
      again.addEventListener('click', () => {
        resetAnswerState(ctx)
        ctx.go('survey')
        ctx.toast('已开始新的作答', 'ok')
      })
    }

    const share = root.querySelector('[data-share]')
    if (share) {
      share.addEventListener('click', () => ctx.toast('分享链接已复制', 'ok'))
    }

    return () => {
      ctx.state.viewingResult = null
    }
  }

  // ── 5. 作答记录 ──────────────────────────────────────────────────────────

  function buildRecords(ctx) {
    const s = ctx.state
    const survey = s.survey
    const submitted = !!s.submitted && !!s.result
    const answered = countAnswered(survey, s.answers)
    const current = {
      key: 'current',
      title: survey.title,
      status: submitted ? 'submitted' : 'draft',
      score: submitted ? s.result.score : null,
      total: submitted ? s.result.total : null,
      time: submitted ? s.result.submittedAt : s.draftSavedAt ? '暂存于 ' + s.draftSavedAt : '尚未作答',
      batch: submitted ? s.result.batchNo : '',
      progress: '已答 ' + answered + ' / ' + survey.questions.length + ' 题',
      action: submitted ? 'view' : 'continue',
    }
    const rows = [current].concat(
      HISTORY.map((item) => ({
        key: item.key,
        title: item.title,
        status: 'submitted',
        score: item.score,
        total: item.total,
        time: item.submittedAt,
        batch: item.batchNo,
        progress: item.dims.join(' · '),
        action: 'history',
      })),
    )
    return rows
  }

  function renderRecords(ctx) {
    const rows = buildRecords(ctx)
    return (
      '<div class="ans ans--records">' +
        appbar(ctx, { title: '作答记录', backTo: 'cover' }) +
        '<div class="ans-page ans-records">' +
          '<div class="ans-records__bar">' +
            '<div class="seg" role="tablist" aria-label="筛选记录">' +
              '<button type="button" class="seg__item is-active" role="tab" aria-selected="true" data-filter="all">全部</button>' +
              '<button type="button" class="seg__item" role="tab" aria-selected="false" data-filter="submitted">已提交</button>' +
              '<button type="button" class="seg__item" role="tab" aria-selected="false" data-filter="draft">草稿</button>' +
            '</div>' +
            '<span class="ans-records__count tnum" data-rec-count>' + rows.length + ' 条</span>' +
          '</div>' +
          '<div class="ans-recs" data-recs>' +
            rows
              .map((row) => {
                const tag =
                  row.status === 'submitted'
                    ? '<span class="tag tag--ok"><span class="tag__dot"></span>已提交</span>'
                    : '<span class="tag tag--muted"><span class="tag__dot"></span>草稿</span>'
                const score =
                  row.score == null
                    ? ''
                    : '<span class="ans-rec__score tnum">' + row.score + '<span> / ' + row.total + '</span></span>'
                let action = ''
                if (row.action === 'continue') {
                  action = '<button type="button" class="ans-rec__link" data-continue>继续作答' + ctx.icon('forward', 14) + '</button>'
                } else if (row.action === 'view') {
                  action = '<button type="button" class="ans-rec__link" data-view-current>查看结果' + ctx.icon('forward', 14) + '</button>'
                } else {
                  action = '<button type="button" class="ans-rec__link" data-history="' + row.key + '">查看结果' + ctx.icon('forward', 14) + '</button>'
                }
                return (
                  '<article class="ans-rec" data-status="' + row.status + '">' +
                    '<div class="ans-rec__top">' +
                      '<h3 class="ans-rec__title">' + esc(row.title) + '</h3>' +
                      score +
                    '</div>' +
                    '<div class="ans-rec__meta">' +
                      tag +
                      '<span class="ans-rec__meta-sep"></span>' +
                      '<span>' + esc(row.time) + '</span>' +
                      (row.batch ? '<span class="ans-rec__meta-sep"></span><span>' + esc(row.batch) + '</span>' : '') +
                    '</div>' +
                    '<div class="ans-rec__bottom">' +
                      '<span class="ans-rec__progress">' + esc(row.progress) + '</span>' +
                      action +
                    '</div>' +
                  '</article>'
                )
              })
              .join('') +
          '</div>' +
          '<div class="empty ans-records__empty" data-recs-empty hidden>' +
            '<span class="empty__art">' + ctx.icon('paper', 40) + '</span>' +
            '<p class="empty__title">没有符合条件的记录</p>' +
            '<p class="empty__tip">换个筛选，或回到封面开始一份新的问卷。</p>' +
            '<button type="button" class="btn btn--ghost" data-goto="cover">回到封面</button>' +
          '</div>' +
          '<p class="ans-foot">草稿只保存在当前浏览器 · 换设备登录可查看已提交记录</p>' +
        '</div>' +
      '</div>'
    )
  }

  function mountRecords(root, ctx) {
    wireGoto(root, ctx)

    const empty = root.querySelector('[data-recs-empty]')
    const count = root.querySelector('[data-rec-count]')
    const filters = root.querySelectorAll('[data-filter]')

    function applyFilter(key) {
      let visible = 0
      root.querySelectorAll('.ans-rec').forEach((rec) => {
        const show = key === 'all' || rec.getAttribute('data-status') === key
        rec.hidden = !show
        if (show) visible += 1
      })
      if (count) count.textContent = visible + ' 条'
      if (empty) empty.hidden = visible > 0
    }

    filters.forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-filter')
        filters.forEach((other) => {
          const on = other === btn
          other.classList.toggle('is-active', on)
          other.setAttribute('aria-selected', String(on))
        })
        applyFilter(key)
      })
    })

    const continued = root.querySelector('[data-continue]')
    if (continued) continued.addEventListener('click', () => ctx.go('survey'))

    const currentView = root.querySelector('[data-view-current]')
    if (currentView) {
      currentView.addEventListener('click', () => {
        ctx.state.viewingResult = null
        ctx.go('result')
      })
    }

    root.querySelectorAll('[data-history]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-history')
        const item = HISTORY.find((entry) => entry.key === key)
        if (!item) return
        ctx.state.viewingResult = item
        ctx.go('result')
      })
    })
  }

  // ── 6. 我的测评 ──────────────────────────────────────────────────────────

  function renderCouple(ctx) {
    const s = ctx.state
    const session = s.session || { loggedIn: false }
    if (!session.loggedIn) {
      return (
        '<div class="ans ans--couple">' +
          appbar(ctx, { title: '我的测评', backTo: 'cover' }) +
          '<div class="ans-page">' +
            '<div class="ans-guest">' +
              '<span class="ans-guest__art">' + ctx.icon('users', 26) + '</span>' +
              '<h1 class="ans-guest__title">登录后查看全部测评</h1>' +
              '<p class="ans-guest__tip">已完成的测评、分数与维度会保存在你的账号里，换设备登录也能看到。</p>' +
              '<button type="button" class="btn btn--primary" data-login>登录查看</button>' +
              '<p class="ans-guest__foot">账号由园区统一发放</p>' +
            '</div>' +
          '</div>' +
        '</div>'
      )
    }

    const cards = HISTORY.map(
      (item) =>
        '<button type="button" class="ans-mcard" data-history="' + item.key + '">' +
          '<span class="ans-mcard__top">' +
            '<span class="ans-mcard__title">' + esc(item.title) + '</span>' +
            '<span class="ans-mcard__score tnum">' + item.score + '<span> / ' + item.total + '</span></span>' +
          '</span>' +
          '<span class="ans-mcard__meta">' +
            '<span class="tag tag--ok"><span class="tag__dot"></span>已提交</span>' +
            '<span class="ans-rec__meta-sep"></span>' +
            '<span class="tnum">' + esc(item.submittedAt) + '</span>' +
          '</span>' +
          '<span class="ans-mcard__dims">' +
            item.dims.map((dim) => '<span class="chip chip--muted">' + esc(dim) + '</span>').join('') +
          '</span>' +
          '<span class="ans-mcard__go">查看结果' + ctx.icon('forward', 14) + '</span>' +
        '</button>',
    ).join('')

    return (
      '<div class="ans ans--couple">' +
        appbar(ctx, {
          title: '我的测评',
          backTo: 'cover',
          action: '<button type="button" class="appbar__action" data-logout>退出</button>',
        }) +
        '<div class="ans-page">' +
          '<div class="ans-me">' +
            '<span class="ans-me__avatar">' + esc(String(session.name || '林').slice(0, 1)) + '</span>' +
            '<div>' +
              '<p class="ans-me__name">' + esc(session.name || '林一舟') + '</p>' +
              '<p class="ans-me__dept">' + esc(session.dept || '技术部') + '</p>' +
            '</div>' +
          '</div>' +
          '<div class="ans-sec">' +
            '<span class="ans-sec__label">已完成</span>' +
            '<span class="ans-sec__count tnum">' + HISTORY.length + ' 份</span>' +
          '</div>' +
          '<div class="ans-mcards">' + cards + '</div>' +
          '<p class="ans-foot">测评结果仅本人可见</p>' +
        '</div>' +
      '</div>'
    )
  }

  function mountCouple(root, ctx) {
    wireGoto(root, ctx)

    const login = root.querySelector('[data-login]')
    if (login) login.addEventListener('click', () => ctx.go('login-m'))

    const logout = root.querySelector('[data-logout]')
    if (logout) {
      logout.addEventListener('click', () => {
        ctx
          .confirm({
            title: '退出登录',
            body: '退出后需要重新登录才能查看已完成的测评。',
            confirmText: '退出',
          })
          .then((ok) => {
            if (!ok) return
            ctx.state.session.loggedIn = false
            ctx.save()
            ctx.rerender()
            ctx.toast('已退出登录', 'info')
          })
      })
    }

    root.querySelectorAll('[data-history]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-history')
        const item = HISTORY.find((entry) => entry.key === key)
        if (!item) return
        ctx.state.viewingResult = item
        ctx.go('result')
      })
    })
  }

  // ── 7. 移动登录 ──────────────────────────────────────────────────────────

  let showPassword = false

  function renderLogin(ctx) {
    return (
      '<div class="ans ans--login">' +
        '<div class="ans-login">' +
          '<button type="button" class="btn btn--icon ans-login__back" data-goto="couple" aria-label="返回">' +
            ctx.icon('back', 20) +
          '</button>' +
          '<div class="ans-brand">' +
            '<span class="ans-brand__mark" aria-hidden="true">问</span>' +
            '<p class="ans-brand__word">园区问卷</p>' +
            '<span class="ans-brand__tag">健康与体验调研</span>' +
          '</div>' +
          '<h1 class="ans-login__title">登录你的账号</h1>' +
          '<p class="ans-login__sub">查看已完成的测评与历史记录</p>' +
          '<form class="ans-login__form" data-login-form novalidate>' +
            '<div class="field" data-field="acc">' +
              '<label class="field__label" for="acc">账号</label>' +
              '<input class="input" id="acc" name="account" type="text" autocomplete="username" placeholder="请输入账号">' +
            '</div>' +
            '<div class="field" data-field="pass">' +
              '<label class="field__label" for="pass">密码</label>' +
              '<div class="ans-pass">' +
                '<input class="input" id="pass" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">' +
                '<button type="button" class="ans-pass__toggle" data-eye aria-label="显示密码" aria-pressed="false">' +
                  ctx.icon(showPassword ? 'eye-off' : 'eye', 20) +
                '</button>' +
              '</div>' +
            '</div>' +
            '<label class="switch ans-login__remember">' +
              '<input type="checkbox" checked>' +
              '<span class="switch__track"></span>' +
              '<span class="switch__text">记住我</span>' +
            '</label>' +
            '<p class="ans-login__err" data-login-err role="alert" hidden></p>' +
            '<button type="submit" class="btn btn--primary btn--block">登录</button>' +
            '<p class="ans-login__hint">演示账号 linyizhou · 密码 123456</p>' +
          '</form>' +
          '<p class="ans-login__foot"><span>账号由园区统一发放</span><span>忘记密码请联系行政</span></p>' +
        '</div>' +
      '</div>'
    )
  }

  function mountLogin(root, ctx) {
    wireGoto(root, ctx)
    const form = root.querySelector('[data-login-form]')
    if (!form) return undefined
    const accEl = root.querySelector('#acc')
    const passEl = root.querySelector('#pass')
    const errEl = root.querySelector('[data-login-err]')
    const eye = root.querySelector('[data-eye]')
    let busy = false

    if (eye) {
      eye.addEventListener('click', () => {
        showPassword = !showPassword
        passEl.type = showPassword ? 'text' : 'password'
        eye.setAttribute('aria-pressed', String(showPassword))
        eye.setAttribute('aria-label', showPassword ? '隐藏密码' : '显示密码')
        eye.innerHTML = ctx.icon(showPassword ? 'eye-off' : 'eye', 20)
        passEl.focus({ preventScroll: true })
      })
    }

    function showError(message, target) {
      if (errEl) {
        errEl.innerHTML = ctx.icon('close', 14) + '<span>' + esc(message) + '</span>'
        errEl.hidden = false
      }
      form.classList.remove('ans-shake')
      void form.offsetWidth
      form.classList.add('ans-shake')
      if (target) target.focus()
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault()
      if (busy) return
      const account = accEl.value.trim()
      const password = passEl.value
      if (!account) {
        showError('请输入账号', accEl)
        return
      }
      if (!password) {
        showError('请输入密码', passEl)
        return
      }
      if (account.toLowerCase() !== 'linyizhou' || password !== '123456') {
        showError('账号或密码不正确', accEl)
        return
      }
      busy = true
      if (errEl) errEl.hidden = true
      ctx.state.session.loggedIn = true
      ctx.state.session.name = '林一舟'
      ctx.state.session.dept = '技术部'
      ctx.save()
      ctx.go('couple')
      ctx.toast('已登录', 'ok')
    })
  }

  // ── 注册 ─────────────────────────────────────────────────────────────────

  const register = (id, def) => P().register(id, def)

  register('cover', {
    group: 'answer',
    label: '问卷封面',
    note: '大标题 + 信息条 + 单一主行动',
    render: renderCover,
    mount: mountCover,
  })

  register('survey', {
    group: 'answer',
    label: '作答页',
    note: '吸顶进度 + 整行选项 + 自动暂存',
    render: (ctx) => renderSurvey(ctx, {}),
    mount: (root, ctx) => mountSurvey(root, ctx),
  })

  register('survey-invalid', {
    group: 'answer',
    label: '作答页 · 校验失败',
    note: '必答校验失败：错误摘要 + 题块标红',
    render: (ctx) => renderSurvey(ctx, { invalid: true }),
    mount: (root, ctx) => mountSurvey(root, ctx),
  })

  register('submit', {
    group: 'answer',
    label: '提交信息',
    note: '提交前确认联系信息 · 隐私说明',
    render: renderSubmit,
    mount: mountSubmit,
  })

  register('result', {
    group: 'answer',
    label: '作答结果',
    note: 'SVG 分数环 + 逐题回顾（我的作答 / 正确答案）',
    render: renderResult,
    mount: mountResult,
  })

  register('records', {
    group: 'answer',
    label: '作答记录',
    note: '草稿与历史记录 · 筛选与空态',
    render: renderRecords,
    mount: mountRecords,
  })

  register('couple', {
    group: 'answer',
    label: '我的测评',
    note: '登录后查看已完成测评',
    render: renderCouple,
    mount: mountCouple,
  })

  register('login-m', {
    group: 'answer',
    label: '移动登录',
    note: '账号密码 · 明文切换 · 错误抖动',
    render: renderLogin,
    mount: mountLogin,
  })
})()

</script>
  <script data-src="assets/admin.js">
/* ═══════════════════════════════════════════════════════════════════════════
   V6「清简」· 管理端交互
   —— 问卷列表 / 列表加载 / 可视化设计器 / 桌面登录
   只通过 window.Proto 的公开 API 与外壳协作。
   ═══════════════════════════════════════════════════════════════════════════ */

(function () {
  'use strict'

  const Proto = window.Proto
  if (!Proto) return

  const esc = Proto.esc
  const icon = Proto.icon
  const fmt = Proto.fmt

  /* ── 常量与工具 ─────────────────────────────────────────────────────────── */

  const PAGE_SIZE = 5
  const STATUSES = ['全部', '未开始', '进行中', '已结束']

  const TYPES = [
    { value: 'radio', label: '单选' },
    { value: 'checkbox', label: '多选' },
    { value: 'text', label: '文本' },
    { value: 'textarea', label: '多行文本' },
    { value: 'number', label: '数字' },
    { value: 'date', label: '日期' },
    { value: 'address', label: '地址' },
    { value: 'image', label: '图片' },
    { value: 'ref', label: '引用' },
  ]
  const OPTION_TYPES = ['radio', 'checkbox', 'ref']
  const SCORE_TYPES = ['radio', 'checkbox']

  const pad2 = (n) => (n < 10 ? '0' + n : String(n))
  const clone = (value) => JSON.parse(JSON.stringify(value))
  const typeLabel = (type) => (TYPES.find((item) => item.value === type) || {}).label || '文本'
  const hasOptions = (type) => OPTION_TYPES.indexOf(type) >= 0
  const hasScore = (type) => SCORE_TYPES.indexOf(type) >= 0

  function stampShort() {
    const d = new Date()
    return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes())
  }

  function stampNo() {
    const d = new Date()
    return (
      'ACT' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
      pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds())
    )
  }

  function defaultDeadline() {
    const d = new Date()
    d.setDate(d.getDate() + 45)
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
  }

  function avatarText(name) {
    const text = String(name || '').trim()
    return text ? text.slice(0, 1) : '林'
  }

  /* ── 列表页 UI 状态（跨重渲染保留） ─────────────────────────────────────── */

  const listView = { q: '', status: '全部', page: 1, flash: null }

  function ensureAdminState(ctx) {
    const state = ctx.state
    if (!Array.isArray(state.activities)) state.activities = []
    if (!state.session) state.session = { loggedIn: false, name: '林一舟', dept: '技术部' }
    return state
  }

  function findActivity(ctx, no) {
    const list = ctx.state.activities || []
    return list.find((item) => item.no === no) || null
  }

  function filteredActivities(ctx) {
    const keyword = listView.q.trim().toLowerCase()
    return (ctx.state.activities || []).filter((item) => {
      if (listView.status !== '全部' && item.status !== listView.status) return false
      if (!keyword) return true
      return [item.title, item.desc, item.no, item.owner].some(
        (value) => String(value || '').toLowerCase().indexOf(keyword) >= 0,
      )
    })
  }

  function hasFilters() {
    return listView.q.trim() !== '' || listView.status !== '全部'
  }

  function statusTag(status) {
    const map = {
      进行中: 'tag--accent',
      未开始: 'tag--warn',
      已结束: 'tag--muted',
    }
    return (
      '<span class="tag ' + (map[status] || 'tag--muted') + '">' +
      '<span class="tag__dot" aria-hidden="true"></span>' + esc(status) +
      '</span>'
    )
  }

  /* ── 弹层（自建：用于表单 / 预览，支持焦点陷阱与 Esc） ────────────────── */

  let activeDialog = null

  function closeDialog() {
    if (activeDialog) activeDialog.close()
  }

  function openDialog(root, options) {
    closeDialog()
    const opts = options || {}
    const host = root.parentElement && root.parentElement.classList.contains('device__screen')
      ? root.parentElement
      : root

    const el = document.createElement('div')
    el.className = 'adm-dialog' + (opts.className ? ' ' + opts.className : '')
    el.innerHTML =
      '<div class="adm-dialog__scrim" data-dialog-scrim></div>' +
      '<div class="adm-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="adm-dialog-title">' +
        '<div class="adm-dialog__head">' +
          '<div>' +
            '<div class="adm-dialog__title" id="adm-dialog-title">' + esc(opts.title || '') + '</div>' +
            (opts.sub ? '<div class="adm-dialog__sub">' + esc(opts.sub) + '</div>' : '') +
          '</div>' +
          '<button type="button" class="adm-dialog__close" data-dialog-close aria-label="关闭弹层">' +
            icon('close', 18) +
          '</button>' +
        '</div>' +
        '<div class="adm-dialog__body">' + (opts.body || '') + '</div>' +
        (opts.foot ? '<div class="adm-dialog__foot">' + opts.foot + '</div>' : '') +
      '</div>'

    const lastFocus = document.activeElement
    const panel = el.querySelector('.adm-dialog__panel')

    const focusables = () =>
      Array.from(
        panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'),
      ).filter((node) => !node.disabled && node.offsetParent !== null)

    function onKey(event) {
      if (event.key === 'Escape') {
        event.preventDefault()
        event.stopPropagation()
        close()
        return
      }
      if (event.key !== 'Tab') return
      const list = focusables()
      if (!list.length) return
      const first = list[0]
      const last = list[list.length - 1]
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault()
        last.focus()
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault()
        first.focus()
      }
    }

    function close() {
      if (!activeDialog || activeDialog.el !== el) return
      activeDialog = null
      document.removeEventListener('keydown', onKey, true)
      el.remove()
      if (lastFocus && lastFocus.isConnected && typeof lastFocus.focus === 'function') lastFocus.focus()
      if (typeof opts.onClose === 'function') opts.onClose()
    }

    activeDialog = { el, panel, close }
    document.addEventListener('keydown', onKey, true)

    el.querySelectorAll('[data-dialog-close]').forEach((node) => node.addEventListener('click', close))
    const scrim = el.querySelector('[data-dialog-scrim]')
    if (scrim) scrim.addEventListener('click', close)
    host.appendChild(el)

    const target = (opts.focus && panel.querySelector(opts.focus)) || focusables()[0]
    if (target) target.focus()
    return { el, panel, close }
  }

  /* ── 通用：管理端顶栏 ───────────────────────────────────────────────────── */

  function appbarMarkup(ctx, crumb, options) {
    const opts = options || {}
    const session = ctx.state.session || {}
    let right = ''
    if (opts.static) {
      right =
        '<div class="adm-user">' +
          '<span class="adm-user__avatar" aria-hidden="true">' + esc(avatarText(session.name)) + '</span>' +
          '<div class="adm-user__text">' +
            '<span class="adm-user__name">' + esc(session.name || '未登录') + '</span>' +
            '<span class="adm-user__dept">' + esc(session.dept || '') + '</span>' +
          '</div>' +
        '</div>'
    } else if (session.loggedIn) {
      right =
        '<div class="adm-user">' +
          '<span class="adm-user__avatar" aria-hidden="true">' + esc(avatarText(session.name)) + '</span>' +
          '<div class="adm-user__text">' +
            '<span class="adm-user__name">' + esc(session.name || '未登录') + '</span>' +
            '<span class="adm-user__dept">' + esc(session.dept || '') + '</span>' +
          '</div>' +
        '</div>' +

    return (
      '<header class="adm-appbar">' +
        '<div class="adm-appbar__brand">' +
          '<span class="adm-mark" aria-hidden="true">问</span>' +
          '<span class="adm-wordmark">园区问卷</span>' +
        '</div>' +
        '<span class="adm-appbar__div" aria-hidden="true"></span>' +
        '<span class="adm-appbar__crumb">' + esc(crumb) + '</span>' +
        '<span class="adm-appbar__spacer"></span>' +

  /* ═══════════════════════════════════════════════════════════════════════════
     屏 1 · 问卷列表
     ═══════════════════════════════════════════════════════════════════════════ */

  function pageHeadMarkup(ctx) {
    const list = ctx.state.activities || []
    const running = list.filter((item) => item.status === '进行中').length
    const replies = list.reduce((sum, item) => sum + (Number(item.replies) || 0), 0)
    return (
      '<div class="adm-pagehead">' +
        '<div>' +
          '<h1 class="adm-pagehead__title">问卷列表</h1>' +
          '<div class="adm-pagehead__sub">' +
            '<span>共 <b class="tnum">' + fmt(list.length) + '</b> 份</span>' +
            '<span class="adm-dotsep" aria-hidden="true"></span>' +
            '<span>进行中 <b class="tnum">' + fmt(running) + '</b></span>' +
            '<span class="adm-dotsep" aria-hidden="true"></span>' +
            '<span>累计回收 <b class="tnum">' + fmt(replies) + '</b> 份</span>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="btn btn--primary" data-act="create">' +
          icon('plus', 16) + '<span>新建问卷</span>' +
        '</button>' +
      '</div>'
    )
  }

  function toolbarMarkup() {
    return (
      '<div class="adm-toolbar">' +
        '<div class="adm-search">' +
          '<span class="adm-search__icon" aria-hidden="true">' + icon('search', 16) + '</span>' +
          '<input class="input" type="search" data-ref="search" value="' + esc(listView.q) +
            '" placeholder="搜索问卷名称、编号或负责人" aria-label="搜索问卷" autocomplete="off">' +
          '<button type="button" class="adm-search__clear" data-act="clear-search" aria-label="清除搜索"' +
            (listView.q ? '' : ' hidden') + '>' + icon('close', 16) + '</button>' +
        '</div>' +
        '<div class="seg adm-statusseg" role="group" aria-label="按状态筛选">' +
          STATUSES.map((status) =>
            '<button type="button" class="seg__item' + (listView.status === status ? ' is-active' : '') +
              '" data-status="' + esc(status) + '" aria-pressed="' + (listView.status === status) + '">' +
              esc(status) + '</button>',
          ).join('') +
        '</div>' +
        '<span class="adm-appbar__spacer"></span>' +
        '<button type="button" class="btn btn--quiet btn--sm" data-act="reset"' +
          (hasFilters() ? '' : ' disabled') + '>' + icon('refresh', 14) + '<span>重置</span></button>' +
      '</div>'
    )
  }

  function listRowMarkup(activity) {
    return (
      '<tr data-no="' + esc(activity.no) + '"' + (listView.flash === activity.no ? ' class="is-new"' : '') + '>' +
        '<td>' +
          '<div class="adm-q">' +
            '<div class="adm-q__title" title="' + esc(activity.title) + '">' + esc(activity.title) + '</div>' +
            '<div class="adm-q__desc">' + esc(activity.desc || '—') + '</div>' +
          '</div>' +
        '</td>' +
        '<td>' + statusTag(activity.status) + '</td>' +
        '<td class="adm-cell--num">' + fmt(activity.items || 0) + '</td>' +
        '<td class="adm-cell--num">' + fmt(activity.replies || 0) + '</td>' +
        '<td class="adm-cell--time">' + esc(activity.deadline || '—') + '</td>' +
        '<td class="adm-cell--time">' + esc(activity.updatedAt || '—') + '</td>' +
        '<td class="adm-morecell">' +
          '<div class="adm-rowacts">' +
            '<button type="button" class="adm-act" data-act="edit" data-no="' + esc(activity.no) + '">编辑</button>' +
            '<button type="button" class="adm-act" data-act="answer" data-no="' + esc(activity.no) + '">作答</button>' +
            '<button type="button" class="adm-act adm-act--icon" data-act="menu" data-no="' + esc(activity.no) +
              '" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false">' + icon('more', 16) + '</button>' +
          '</div>' +
        '</td>' +
      '</tr>'
    )
  }

  function pagerMarkup(page, pages) {
    if (pages <= 1) return ''
    let numbers = ''
    for (let i = 1; i <= pages; i += 1) {
      numbers +=
        '<button type="button" class="adm-pagebtn' + (i === page ? ' is-active' : '') +
        '" data-act="page" data-page="' + i + '" aria-label="第 ' + i + ' 页"' +
        (i === page ? ' aria-current="page"' : '') + '>' + i + '</button>'
    }
    return (
      '<div class="adm-pager">' +
        '<button type="button" class="adm-pagebtn" data-act="prev" aria-label="上一页"' +
          (page <= 1 ? ' disabled' : '') + '>' + icon('back', 14) + '</button>' +
        numbers +
        '<button type="button" class="adm-pagebtn" data-act="next" aria-label="下一页"' +
          (page >= pages ? ' disabled' : '') + '>' + icon('forward', 14) + '</button>' +
      '</div>'
    )
  }

  function emptyArt() {
    return (
      '<svg width="72" height="72" viewBox="0 0 72 72" fill="none" stroke="currentColor" ' +
        'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M22 12h20l10 10v34a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4Z"/>' +
        '<path d="M42 12v10h10"/>' +
        '<path d="M27 30h16M27 38h11"/>' +
        '<circle cx="46" cy="47" r="9"/>' +
        '<path d="m52.6 53.6 6.4 6.4"/>' +
      '</svg>'
    )
  }

  function renderList(ctx) {
    ensureAdminState(ctx)
    const rows = filteredActivities(ctx)
    const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE))
    const page = Math.min(Math.max(1, listView.page), pages)
    listView.page = page
    const start = (page - 1) * PAGE_SIZE
    const pageRows = rows.slice(start, start + PAGE_SIZE)

    const body =
      pageRows.map((activity) => listRowMarkup(activity)).join('')

    return (
      '<div class="adm adm--list dense">' +
        appbarMarkup(ctx, '问卷') +
        '<main class="adm-main">' +
          pageHeadMarkup(ctx) +
          toolbarMarkup() +
          '<div class="adm-card adm-tablewrap">' +
            '<table class="adm-table" aria-label="问卷列表">' +
              '<colgroup>' +
                '<col>' +
                '<col class="adm-col--status">' +
                '<col class="adm-col--items">' +
                '<col class="adm-col--replies">' +
                '<col class="adm-col--deadline">' +
                '<col class="adm-col--updated">' +
                '<col class="adm-col--acts">' +
              '</colgroup>' +
              '<thead>' +
                '<tr>' +
                  '<th scope="col">问卷</th>' +
                  '<th scope="col">状态</th>' +
                  '<th scope="col" class="adm-th--num">题量</th>' +
                  '<th scope="col" class="adm-th--num">回收份数</th>' +
                  '<th scope="col">截止</th>' +
                  '<th scope="col">更新</th>' +
                  '<th scope="col">操作</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody data-ref="rows">' + body + '</tbody>' +
            '</table>' +
            '<div class="empty adm-empty" data-ref="empty"' + (rows.length ? ' hidden' : '') + '>' +
              '<div class="empty__art">' + emptyArt() + '</div>' +
              '<div class="empty__title">没有匹配的问卷</div>' +
              '<div class="empty__tip">换个关键字，或点右上角新建一份</div>' +
              '<button type="button" class="btn btn--ghost btn--sm" data-act="reset">清除筛选</button>' +
            '</div>' +
            '<div class="adm-tablefoot">' +
              '<span data-ref="count">' + footerCountText(rows.length, start, pageRows.length) + '</span>' +
              '<div data-ref="pager">' + pagerMarkup(page, pages) + '</div>' +
            '</div>' +
          '</div>' +
        '</main>' +
      '</div>'
    )
  }

  function footerCountText(total, start, shown) {
    if (!total) return '共 0 份'
    return '显示 ' + (start + 1) + '–' + (start + shown) + ' · 共 ' + total + ' 份'
  }

  function mountList(root, ctx) {
    ensureAdminState(ctx)
    const tbody = root.querySelector('[data-ref="rows"]')
    const emptyEl = root.querySelector('[data-ref="empty"]')
    const countEl = root.querySelector('[data-ref="count"]')
    const pagerEl = root.querySelector('[data-ref="pager"]')
    const searchInput = root.querySelector('[data-ref="search"]')
    const clearBtn = root.querySelector('[data-act="clear-search"]')
    const resetBtn = root.querySelector('[data-act="reset"]')
    const segWrap = root.querySelector('.adm-statusseg')

    let openMenuEl = null
    let openMenuBtn = null

    function closeMenu(refocus) {
      if (!openMenuEl) return
      const btn = openMenuBtn
      openMenuEl.remove()
      openMenuEl = null
      openMenuBtn = null
      if (btn) {
        btn.setAttribute('aria-expanded', 'false')
        if (refocus) btn.focus()
      }
    }

    function syncToolbarState() {
      if (clearBtn) clearBtn.hidden = !listView.q
      if (resetBtn) resetBtn.disabled = !hasFilters()
      if (segWrap) {
        segWrap.querySelectorAll('[data-status]').forEach((btn) => {
          const active = btn.getAttribute('data-status') === listView.status
          btn.classList.toggle('is-active', active)
          btn.setAttribute('aria-pressed', active ? 'true' : 'false')
        })
      }
    }

    function paint() {
      const rows = filteredActivities(ctx)
      const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE))
      const page = Math.min(Math.max(1, listView.page), pages)
      listView.page = page
      const start = (page - 1) * PAGE_SIZE
      const pageRows = rows.slice(start, start + PAGE_SIZE)

      tbody.innerHTML = pageRows.map((activity) => listRowMarkup(activity)).join('')
      if (emptyEl) emptyEl.hidden = rows.length > 0
      if (countEl) countEl.textContent = footerCountText(rows.length, start, pageRows.length)
      if (pagerEl) pagerEl.innerHTML = pagerMarkup(page, pages)
      syncToolbarState()
      closeMenu(false)
    }

    function openMenu(button) {
      const menuNo = button.getAttribute('data-no')
      closeMenu(false)
      if (!menuNo) return
      const cell = button.closest('.adm-morecell')
      if (!cell) return
      const menu = document.createElement('div')
      menu.className = 'adm-menu'
      menu.setAttribute('role', 'menu')
      menu.setAttribute('aria-label', '更多操作')
      menu.innerHTML =
        '<button type="button" role="menuitem" class="adm-menu__item" data-act="copy" data-no="' + esc(menuNo) + '">' +
          icon('copy', 16) + '<span>复制问卷</span></button>' +
        '<button type="button" role="menuitem" class="adm-menu__item adm-menu__item--danger" data-act="delete" data-no="' +
          esc(menuNo) + '">' + icon('trash', 16) + '<span>删除问卷</span></button>'
      cell.appendChild(menu)
      openMenuEl = menu
      openMenuBtn = button
      button.setAttribute('aria-expanded', 'true')
      const first = menu.querySelector('button')
      if (first) first.focus()
    }

    function answerActivity(no) {
      const act = findActivity(ctx, no)
      const survey = ctx.state.survey || {}
      if (act && survey.no && act.no !== survey.no) {
        ctx.toast('作答端演示使用「员工满意度调查」数据', 'info')
      }
      ctx.go('survey')
    }

    function openCreate() {
      const dialog = openDialog(root, {
        title: '新建问卷',
        sub: '创建后进入设计器添加题目；也可以直接从模板开始。',
        body:
          '<div class="adm-form">' +
            '<div class="field" data-field="title">' +
              '<label class="field__label" for="adm-new-title">问卷名称 <span class="field__req">*</span></label>' +
              '<input class="input" id="adm-new-title" data-new="title" placeholder="例如：员工满意度调查" autocomplete="off">' +
              '<div class="field__error" data-error="title" hidden>' + icon('close', 14) + '<span>请填写问卷名称</span></div>' +
            '</div>' +
            '<div class="field">' +
              '<label class="field__label" for="adm-new-desc">说明</label>' +
              '<input class="input" id="adm-new-desc" data-new="desc" placeholder="一句话说明问卷用途（选填）" autocomplete="off">' +
            '</div>' +
            '<div class="adm-form__row">' +
              '<div class="field">' +
                '<label class="field__label" for="adm-new-deadline">截止日期</label>' +
                '<input class="input" id="adm-new-deadline" type="date" data-new="deadline" value="' + defaultDeadline() + '">' +
              '</div>' +
              '<div class="field">' +
                '<label class="field__label" for="adm-new-template">模板</label>' +
                '<select class="select" id="adm-new-template" data-new="template">' +
                  '<option value="blank">空白问卷</option>' +
                  '<option value="survey">员工满意度调研模板</option>' +
                '</select>' +
              '</div>' +
            '</div>' +
            '<p class="adm-props__hint">空白问卷从 0 题开始；模板会带入 11 道示例题目，可随时增删。</p>' +
          '</div>',
        foot:
          '<button type="button" class="btn btn--quiet" data-dialog-action="cancel">取消</button>' +
          '<button type="button" class="btn btn--primary" data-dialog-action="create">' +
            icon('plus', 16) + '<span>创建问卷</span></button>',
        focus: '[data-new="title"]',
      })

      const panel = dialog.panel
      const titleInput = panel.querySelector('[data-new="title"]')
      const descInput = panel.querySelector('[data-new="desc"]')
      const deadlineInput = panel.querySelector('[data-new="deadline"]')
      const templateSelect = panel.querySelector('[data-new="template"]')
      const titleField = panel.querySelector('[data-field="title"]')
      const titleError = panel.querySelector('[data-error="title"]')

      function submit() {
        const title = titleInput.value.trim()
        if (!title) {
          titleField.classList.add('is-invalid')
          if (titleError) titleError.hidden = false
          titleInput.focus()
          titleInput.classList.add('is-invalid')
          return
        }
        const isSurveyTemplate = templateSelect.value === 'survey'
        const activity = {
          no: stampNo(),
          title,
          desc: descInput.value.trim() || '新建问卷 · 待完善说明',
          status: '未开始',
          items: isSurveyTemplate ? 11 : 0,
          replies: 0,
          deadline: deadlineInput.value || defaultDeadline(),
          updatedAt: stampShort(),
          owner: (ctx.state.session && ctx.state.session.name) || '林一舟',
        }
        ctx.state.activities.unshift(activity)
        ctx.save()
        dialog.close()
        listView.q = ''
        listView.status = '全部'
        listView.page = 1
        listView.flash = activity.no
        ctx.rerender()
        window.setTimeout(() => {
          listView.flash = null
        }, 900)
        ctx.toast('已创建「' + title + '」', 'ok')
      }

      titleInput.addEventListener('input', () => {
        titleInput.classList.remove('is-invalid')
        titleField.classList.remove('is-invalid')
        if (titleError) titleError.hidden = true
      })
      panel.querySelector('[data-dialog-action="cancel"]').addEventListener('click', () => dialog.close())
      panel.querySelector('[data-dialog-action="create"]').addEventListener('click', submit)
      panel.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && event.target.tagName === 'INPUT') {
          event.preventDefault()
          submit()
        }
      })
    }

    async function deleteActivity(no) {
      const act = findActivity(ctx, no)
      if (!act) return
      const body =
        '「' + act.title + '」' +
        (act.replies ? '及 ' + fmt(act.replies) + ' 份回答' : '') +
        '将被删除，且无法恢复。'
      const ok = await ctx.confirm({
        title: '删除问卷',
        body,
        confirmText: '删除',
        cancelText: '取消',
        danger: true,
      })
      if (!ok) return
      ctx.state.activities = ctx.state.activities.filter((item) => item.no !== no)
      if (ctx.state.designer && ctx.state.designer.activityNo === no) ctx.state.designer = null
      const rows = filteredActivities(ctx)
      const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE))
      if (listView.page > pages) listView.page = pages
      ctx.save()
      ctx.rerender()
      ctx.toast('已删除问卷')
    }

    function copyActivity(no) {
      const list = ctx.state.activities || []
      const index = list.findIndex((item) => item.no === no)
      if (index < 0) return
      const source = list[index]
      const copy = clone(source)
      copy.no = stampNo()
      copy.title = source.title + '（副本）'
      copy.status = '未开始'
      copy.replies = 0
      copy.updatedAt = stampShort()
      copy.owner = (ctx.state.session && ctx.state.session.name) || source.owner
      list.splice(index + 1, 0, copy)
      listView.q = ''
      listView.status = '全部'
      listView.page = Math.floor((index + 1) / PAGE_SIZE) + 1
      listView.flash = copy.no
      ctx.save()
      ctx.rerender()
      window.setTimeout(() => {
        listView.flash = null
      }, 900)
      ctx.toast('已复制为「' + copy.title + '」', 'ok')
    }

    const onClick = (event) => {
      const statusBtn = event.target.closest('[data-status]')
      if (statusBtn && root.contains(statusBtn)) {
        listView.status = statusBtn.getAttribute('data-status')
        listView.page = 1
        paint()
        return
      }

      const node = event.target.closest('[data-act]')
      if (!node || !root.contains(node)) return
      const act = node.getAttribute('data-act')

      switch (act) {
        case 'create':
          openCreate()
          break
        case 'clear-search':
          listView.q = ''
          if (searchInput) searchInput.value = ''
          listView.page = 1
          paint()
          if (searchInput) searchInput.focus()
          break
        case 'reset':
          listView.q = ''
          listView.status = '全部'
          listView.page = 1
          if (searchInput) searchInput.value = ''
          paint()
          break
        case 'edit':
          closeMenu(false)
          ctx.go('designer', { no: node.getAttribute('data-no') })
          break
        case 'answer':
          closeMenu(false)
          answerActivity(node.getAttribute('data-no'))
          break
        case 'menu':
          if (openMenuBtn === node) closeMenu(true)
          else openMenu(node)
          break
        case 'copy':
          closeMenu(false)
          copyActivity(node.getAttribute('data-no'))
          break
        case 'delete':
          closeMenu(false)
          deleteActivity(node.getAttribute('data-no'))
          break
        case 'prev':
          listView.page = Math.max(1, listView.page - 1)
          paint()
          break
        case 'next':
          listView.page += 1
          paint()
          break
        case 'page':
          listView.page = Number(node.getAttribute('data-page')) || 1
          paint()
          break
        case 'logout':
          if (ctx.state.session) ctx.state.session.loggedIn = false
          ctx.save()
          ctx.go('login-d')
          break
        case 'login':
          ctx.go('login-d')
          break
        default:
          break
      }
    }

    const onSearch = () => {
      listView.q = searchInput.value
      listView.page = 1
      paint()
    }

    const onSearchKey = (event) => {
      if (event.key === 'Escape' && searchInput.value) {
        event.preventDefault()
        listView.q = ''
        searchInput.value = ''
        listView.page = 1
        paint()
      }
    }

    const onDocClick = (event) => {
      if (!openMenuEl) return
      if (openMenuEl.contains(event.target) || (openMenuBtn && openMenuBtn.contains(event.target))) return
      closeMenu(false)
    }

    const onKeyDown = (event) => {
      if (!openMenuEl) return
      if (event.key === 'Escape') {
        event.preventDefault()
        closeMenu(true)
      }
    }

    root.addEventListener('click', onClick)
    if (searchInput) {
      searchInput.addEventListener('input', onSearch)
      searchInput.addEventListener('keydown', onSearchKey)
    }
    document.addEventListener('click', onDocClick)
    document.addEventListener('keydown', onKeyDown)

    return () => {
      root.removeEventListener('click', onClick)
      if (searchInput) {
        searchInput.removeEventListener('input', onSearch)
        searchInput.removeEventListener('keydown', onSearchKey)
      }
      document.removeEventListener('click', onDocClick)
      document.removeEventListener('keydown', onKeyDown)
      closeMenu(false)
      closeDialog()
    }
  }

  function buildDesigner(ctx, activity) {
    const survey = ctx.state.survey || {}
    const source = Array.isArray(survey.questions) ? clone(survey.questions) : []
    const items = activity && activity.items === 0 ? [] : source
    return {
      activityNo: activity ? activity.no : survey.no || '',
      title: (activity && activity.title) || survey.title || '未命名问卷',
      desc: (activity && activity.desc) || survey.subtitle || '',
      intro: survey.intro || '',
      deadline: (activity && activity.deadline) || survey.deadline || defaultDeadline(),
      selectedId: items[0] ? items[0].id : null,
      dirty: false,
      items,
    }
  }

  function ensureStudio(ctx) {
    const state = ctx.state
    const activities = Array.isArray(state.activities) ? state.activities : []
    const paramNo = ctx.params && (ctx.params.no || ctx.params.activityNo)
    let designer = state.designer

    if (paramNo) {
      const target = activities.find((item) => item.no === paramNo)
      if (!designer || !Array.isArray(designer.items) || designer.activityNo !== paramNo) {
        designer = buildDesigner(ctx, target || activities[0] || null)
        state.designer = designer
      }
    }
    if (!designer || !Array.isArray(designer.items)) {
      designer = buildDesigner(ctx, activities[0] || null)
      state.designer = designer
    }
    if (activities.length && !activities.some((item) => item.no === designer.activityNo)) {
      designer = buildDesigner(ctx, activities[0])
      state.designer = designer
    }

    if (typeof designer.title !== 'string' || !designer.title) {
      const act = activities.find((item) => item.no === designer.activityNo)
      designer.title = (act && act.title) || '未命名问卷'
    }
    if (typeof designer.desc !== 'string') designer.desc = ''
    if (typeof designer.intro !== 'string') designer.intro = (ctx.state.survey && ctx.state.survey.intro) || ''
    if (typeof designer.deadline !== 'string' || !designer.deadline) designer.deadline = defaultDeadline()
    if (!designer.selectedId || !designer.items.some((item) => item.id === designer.selectedId)) {
      designer.selectedId = designer.items[0] ? designer.items[0].id : null
    }
    designer.dirty = !!designer.dirty

    // 清理悬空的计分答案
    designer.items.forEach((item) => {
      if (!Array.isArray(item.options)) {
        if (hasOptions(item.type)) item.options = []
        else delete item.options
      }
      if (item.correct) {
        const values = Array.isArray(item.correct) ? item.correct : [item.correct]
        const kept = values.filter((value) => item.options && item.options.indexOf(value) >= 0)
        if (!kept.length) delete item.correct
        else item.correct = Array.isArray(item.correct) ? kept : kept[0]
      }
    })
    return designer
  }

  function currentActivity(ctx) {
    const designer = ctx.state.designer
    const activities = ctx.state.activities || []
    if (!designer) return activities[0] || null
    return activities.find((item) => item.no === designer.activityNo) || activities[0] || null
  }

  function studioQuestion(designer) {
    if (!designer.selectedId) return null
    return designer.items.find((item) => item.id === designer.selectedId) || null
  }

  function nextQuestionId(items) {
    let max = 0
    items.forEach((item) => {
      const match = /^q(\d+)$/.exec(String(item.id || ''))
      if (match) max = Math.max(max, Number(match[1]))
    })
    return 'q' + (max + 1)
  }

  function makeQuestion(items) {
    const question = {
      id: nextQuestionId(items),
      type: 'radio',
      title: '未命名题目',
      required: false,
      options: ['选项 1', '选项 2'],
    }
    return question
  }

  function normalizeQuestionType(question) {
    if (hasOptions(question.type)) {
      if (!Array.isArray(question.options) || !question.options.length) {
        question.options = ['选项 1', '选项 2']
      }
    } else {
      delete question.options
      delete question.correct
    }
    if (!hasScore(question.type)) {
      delete question.points
      delete question.correct
    }
  }

  function staticQuestionPreview(question) {
    if (hasOptions(question.type)) {
      const options = Array.isArray(question.options) ? question.options : []
      if (!options.length) return '<p class="adm-props__hint">尚未添加选项</p>'

    }

      return (

    }

    }

    }
